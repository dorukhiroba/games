/* Layout: full-bleed WebGL city; HUD pinned to safe-area edges (progress top, heat gauge left, combo right); end card centered.
   One deliberate sunny-day palette (a single game world, not light/dark variants). */
:root{
  --ink:#162033;
  --paper:#ffffff;
  --sun:#ffd84a;
  --sun-deep:#ff9d1a;
  --ember:#ff4d12;
  --stroke:#5a2a06;
  --go:#2fcf6a;
  --go-deep:#178a43;
  --sky:#cfe8f5;
  --muted:#5d6b80;
  --glass:rgba(22,32,51,.42);
  --theme:#5b9be0;
  --theme-deep:#2f6fbf;
  --f-display:'CBS Display','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'CBS Body','Arial Rounded MT Bold',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}

      if(topIndex>=0&&smashing){
        const seg=segUnderBall(topIndex),dang=layers[topIndex].danger[seg];
        if(dang&&!fireMode){fail();break;}
        breakLayer();combo++;score+=fireMode?2:1;scorePop=1;sfx.smash(combo,fireMode||heat>0.6);
        if(combo>=3)comboPop=1;
        const w=TXT[lang].words;if(combo===10||combo===20||combo===35){comboWord=w[combo===10?0:combo===20?1:2];}
        if(!fireMode){heat=Math.min(1,heat+HEAT_GAIN);if(heat>=1)ignite();}
        if(level===1&&!tipShown&&topIndex>3){for(let k=1;k<=4;k++)if(layers[topIndex-k].danger.some(Boolean)){tipShown=true;toast();break;}}

  elVig.style.opacity=fireMode?(0.8+0.2*Math.sin(time*12)).toFixed(3):(hv*0.35).toFixed(3);
  if(score!==lastScore){elScore.textContent=score;lastScore=score;}
  scorePop=Math.max(0,scorePop-dt*6);elScore.style.transform=`scale(${(1+scorePop*0.16).toFixed(3)})`;
  if(comboPop>0.99){elCnum.innerHTML='<b>x</b>'+combo;elCword.textContent=comboWord;}
  comboPop=Math.max(0,comboPop-dt*1.4);elCombo.style.opacity=Math.min(1,comboPop*2.5).toFixed(3);elCombo.style.transform=`scale(${(0.9+comboPop*0.3).toFixed(3)}) rotate(-6deg)`;
}
function loop(now){const dt=Math.min((now-last)/1000,1/30);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}

/* ================= boot ================= */
function start(data){
  data=data||{};level=data.level||1;score=data.score||0;levelStartScore=score;lang=data.lang||'tr';levelsCleared=data.levelsCleared||0;winEndShown=!!data.winEndShown;firstPlay=!data.level;
  if(!firstPlay)elTut.classList.add('hide');else elTut.classList.add('hide');
  resize();camera.fov=camera.userData.fov;camera.updateProjectionMatrix();applyLang();genLevel(level);resetBall();camFocus=surfY();
  requestAnimationFrame(t=>{last=t;loop(t);});
}
window.__cbs={get s(){return{state,heat,fireMode,topIndex,score,level,ball:ball.y};},hold(v){v?down(null):up();},ignite(){if(state==='play')ignite();},end(k){showEnd(k||'win');}};
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({level,score:levelStartScore,lang,levelsCleared,winEndShown}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
