<!doctype html><html lang="tr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Altı Dilim</title>
<script src="../net.js"></script>
<script src="../quit.js" data-lang="tr"></script>

<style>
/* Layout: one centred play column; a six-slice İznik-tile wheel is the hero and every player's token. */
:root{
  --ink:#0C1330; --ink-2:#131C44; --ink-3:#1C285A; --ink-4:#25336E; --line:#33438A;
  --paper:#F5EFE2; --muted:#A3ACD3; --good:#86D894; --bad:#FF8270;
  --c0:#27B3BE; --c1:#E46A9A; --c2:#EDB143; --c3:#E8644C; --c4:#72BA66; --c5:#5A8DF0;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{
  font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100%;
  background-color:var(--ink);
  background-image:
    radial-gradient(circle at 50% 50%, rgba(245,239,226,.045) 0 1.5px, transparent 2.5px),
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(90,141,240,.18), transparent 70%);
  background-size:26px 26px, 100% 100%;
  background-attachment:fixed;
}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.app{max-width:780px;margin:0 auto;padding-block:14px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;background:none;border:0;padding:0}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.14em;padding:7px 12px;border-radius:999px;background:var(--ink-3);border:1px solid var(--line)}
.ibtn{background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.ibtn:hover{color:var(--paper)}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;line-height:1.02}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;border-radius:999px;padding:13px 20px;border:2px solid var(--paper);background:var(--paper);color:var(--ink);transition:transform .12s, background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--paper)}
.btn.big{font-size:15px;padding:16px 26px}
.field{background:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-width:0;width:100%}
.field:focus{border-color:var(--paper);outline:none}
.code-in{font-family:var(--f-display);letter-spacing:.3em;text-transform:uppercase;max-width:160px;text-align:center}
.seg{display:inline-flex;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.seg button:disabled{opacity:.9}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.setting .lbl{font-weight:600}
.setting .sub{font-size:13px;color:var(--muted)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--paper);box-shadow:0 0 0 2px var(--ink) inset}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding-block:10px 4px}
.hero h1{font-size:clamp(44px,11vw,84px)}
.hero p{margin:10px 0 0;max-width:44ch;color:var(--muted);font-size:17px}
.hero .wheelwrap{width:clamp(110px,26vw,190px)}
.spin-slow{animation:slow 60s linear infinite;transform-origin:50% 50%}
@keyframes slow{to{transform:rotate(360deg)}}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cat-tag{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-width:0}
.cat-tag i{width:12px;height:12px;border-radius:3px;flex:none}
.games{display:flex;flex-direction:column;gap:8px}
.game-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.game-row b{font-family:var(--f-display);letter-spacing:.16em;font-size:14px}
.rules{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:6px;font-size:15px}
.rules b{color:var(--paper)}

/* lobby */
.code-big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,72px);letter-spacing:.18em;line-height:1}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pslot{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-width:0}
.pslot.empty{border-style:dashed;color:var(--muted);opacity:.6;font-size:14px}
.pslot .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:auto;flex:none}
.disc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--ink);flex:none}

/* play */
.stage{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.catpill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px 13px;border-radius:999px;background:var(--cat);color:var(--ink)}
.timer{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:18px;min-width:120px;justify-content:flex-end}
.tbar{height:6px;border-radius:6px;background:var(--ink-3);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--cat,var(--paper));width:calc(var(--p,1)*100%);transition:width .2s linear}
.tbar.low i{background:var(--bad)}
.qtext{font-size:clamp(22px,4.6vw,30px);font-weight:700;line-height:1.25;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;min-height:68px;background:var(--ink-3);border:2px solid var(--ink-4);border-radius:var(--r);padding:12px 14px;font-size:17px;font-weight:600;transition:border-color .12s, background .12s, transform .12s;min-width:0}
.opt .l{font-family:var(--f-display);font-weight:800;font-size:13px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--muted);flex:none}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--cat);transform:translateY(-1px)}
.opt.chosen{border-color:var(--paper);background:var(--ink-4)}
.opt.chosen .l{background:var(--paper);color:var(--ink)}
.opt.gone{opacity:.18;pointer-events:none}
.opt.correct{background:var(--cat);border-color:var(--cat);color:var(--ink)}
.opt.correct .l{background:var(--ink);color:var(--paper)}
.opt.wrong{border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt .who{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.opt .who .disc{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px var(--ink-3)}
.opt:disabled{cursor:default}
.pw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pwb{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px dashed var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--paper)}
.pwb b{font-family:var(--f-display);font-size:12px}
.pwb[aria-pressed="true"]{border-style:solid;border-color:var(--c2);background:rgba(237,177,67,.14)}
.pwb:disabled{opacity:.35}
.status{font-size:15px;color:var(--muted);min-height:22px}
.status b{color:var(--paper)}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pc{display:flex;align-items:center;gap:9px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0;position:relative}
.pc .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pc .sc{font-family:var(--f-display);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pc .mid{display:flex;flex-direction:column;min-width:0;flex:1}
.pc.turn{border-color:var(--paper)}
.pc.away{opacity:.4}
.pc.done::after{content:"✓";position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center}
.pc.me .nm::after{content:" (sen)";color:var(--muted);font-weight:500}

/* wheel */
.wheel{display:block;width:min(100%,380px);margin:0 auto;overflow:visible}
.wheel .slice{cursor:default;transition:filter .15s, opacity .15s}
.wheel.live .slice{cursor:pointer}
.wheel.live .slice:hover{filter:brightness(1.15)}
.wheel .lab{font-family:var(--f-display);font-weight:800;font-size:8.6px;letter-spacing:.06em;fill:var(--ink);pointer-events:none}
.wheel .rot{transform-origin:100px 100px;transform-box:view-box;transition:transform 1.7s cubic-bezier(.17,.84,.24,1)}
.wheel .need{font-size:9px;fill:var(--ink);opacity:.7}
.center{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.pick-h{font-size:clamp(24px,5.5vw,36px)}

.results{display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.res .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .d{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.res .d.pos{color:var(--good)} .res .d.neg{color:var(--bad)}
.res .note{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--ink-4);color:var(--paper);margin-left:6px}

.podium{display:flex;flex-direction:column;gap:8px}
.rank{display:grid;grid-template-columns:34px 30px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rank .n{font-family:var(--f-display);font-weight:800;color:var(--muted)}
.rank.first{border-color:var(--c2);background:linear-gradient(90deg,rgba(237,177,67,.16),var(--ink-2) 70%)}
.rank .sc{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:600;padding:12px 18px;border-radius:12px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.local-list{display:flex;flex-direction:column;gap:8px}
.local-row{display:flex;gap:8px;align-items:center}
.local-row .disc{width:34px;height:34px}
.xbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:44px;color:var(--muted);flex:none;font-size:18px}
.pass{font-size:15px;color:var(--muted)}

/* teams + category picker */
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcard{display:flex;align-items:center;gap:10px;background:var(--ink-2);border:2px solid color-mix(in srgb,var(--tc) 40%,transparent);border-radius:16px;padding:10px 12px;min-width:0}
.tcard.turn{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 22%,transparent)}
.tcard .mid{display:flex;flex-direction:column;min-width:0;flex:1}
.tcard .tn{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--tc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .sc{font-family:var(--f-display);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.tcard .d{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.tcard .d.pos{color:var(--good)} .tcard .d.neg{color:var(--bad)}
.mem{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;margin-left:6px;vertical-align:middle}
.tpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:6px 12px;border-radius:999px;border:1.5px solid var(--tc);color:var(--tc)}
.tcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tcol{display:flex;flex-direction:column;gap:8px;border:1.5px solid color-mix(in srgb,var(--tc) 50%,transparent);border-radius:16px;padding:10px;background:color-mix(in srgb,var(--tc) 7%,var(--ink));min-width:0}
.tcol h3{font-family:var(--f-display);font-size:14px;font-weight:800;color:var(--tc);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcol .pslot{background:var(--ink-2)}
@media (max-width:560px){.tcol .pslot .tag{display:none}.tcol .pslot.me{border-color:var(--paper)}}
button.pslot{width:100%;text-align:left}
button.pslot:hover{border-color:var(--tc)}
.catgrid{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.cchip[aria-pressed="true"]{color:var(--paper);border-color:var(--paper);background:var(--ink-3)}
.cchip .slot{width:10px;height:10px;border-radius:3px;flex:none}
.cchip:disabled[aria-pressed="false"]{opacity:.5}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{background:none;border:1px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.presets button:hover{color:var(--paper);border-color:var(--paper)}

@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .plist{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .wheelwrap{order:-1;width:120px}
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .res{grid-template-columns:30px minmax(0,1fr) auto}
  .res .note{grid-column:2/4}
}
@media (prefers-reduced-motion:reduce){
  .spin-slow{animation:none}
  .wheel .rot{transition:none}
  *{transition-duration:0s!important}
}
</style>

<div class="app">
  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="Altı Dilim ana sayfa"><span id="logo"></span><span>Altı Dilim</span></button>
    <div class="top-r" id="topR"></div>
  </header>
  <main id="main" class="stage"></main>
</div>

<script>
// [kategori, bölge, soru, doğru, yanlış1, yanlış2, yanlış3]
// kategori: CATS dizisindeki sıra (0 Coğrafya … 12 Troll Sorular)
// bölge: "t" = Türkiye, "g" = global
const QS = [
// ── 0 COĞRAFYA ──────────────────────
[0,"t","Türkiye'nin en büyük gölü hangisi?","Van Gölü","Tuz Gölü","Beyşehir Gölü","Eğirdir Gölü"],

[0,"t","2022'de açılan Rize-Artvin Havalimanı nereye kuruldu?","Denize dolgu üzerine","Bir dağın zirvesine","Eski bir çay bahçesine","Yerin altına"],
[0,"t","BM'de 2022'den beri ülkemizin resmi adı nasıl yazılıyor?","Türkiye","Turkey","Turkiya","Türkei"],
[0,"t","Türkiye'nin en kuzey noktası İnceburun hangi ilde?","Sinop","Kastamonu","Samsun","Bartın"],
[0,"t","Dev taş başlarıyla ünlü Nemrut Dağı hangi ilde?","Adıyaman","Malatya","Şanlıurfa","Diyarbakır"],

[0,"t","Plaka kodu 01 olan il hangisi?","Adana","Ankara","Adıyaman","Ağrı"],
[0,"t","Ege'yi Marmara'ya bağlayan boğaz hangisi?","Çanakkale Boğazı","İstanbul Boğazı","Kerç Boğazı","Cebelitarık Boğazı"],
[0,"g","2023'te Çin'i geçip dünyanın en kalabalık ülkesi olan hangisi?","Hindistan","Endonezya","ABD","Pakistan"],
[0,"g","Endonezya'nın Borneo adasında inşa ettiği yeni başkentin adı ne?","Nusantara","Cakarta","Bali","Surabaya"],
[0,"g","BM'nin 2025 raporuna göre dünyanın en kalabalık şehri hangisi?","Cakarta","Tokyo","Delhi","İstanbul"],
[0,"g","Kazakistan'ın başkenti 2022'de yeniden hangi adı aldı?","Astana","Nur-Sultan","Almatı","Bişkek"],
[0,"g","Avustralya'nın başkenti neresi?","Canberra","Sidney","Melbourne","Kanguru Köyü"],
[0,"g","Kanada ile Danimarka 2022'de hangi adayı bölüşüp ‘Viski Savaşı’nı bitirdi?","Hans Adası","Grönland","Viski Adası","İzlanda"],
[0,"g","Fransa'nın en uzun kara sınırı hangi ülkeyle?","Brezilya","İspanya","Belçika","Almanya"],
[0,"g","Lesotho dört bir yandan hangi ülkeyle çevrili?","Güney Afrika","Nijerya","Kenya","Mısır"],

};

// ───────── ev sahibi motoru ─────────
const newTeam=()=>({s:0,w:"000000",d:0,gw:0,c:0,n:0,ok:false});
function newG(){return{v:0,ph:"lobby",set:Object.assign({},settings,{k:settings.k.slice()}),seed:0,r:0,pi:0,pk:null,cat:-1,qid:-1,left:0,pl:[],u:[],fx:null,win:null,tie:false,tm:[newTeam(),newTeam()],tt:0,tq:[-1,-1],tw:-1,code}}
function setPhase(ph,left){G.ph=ph;G.left=left;hostDeadline=Date.now()+left;allDoneAt=0}
function commit(){G.v=(G.v||0)+1;if(mode==="online"){setMyPres({g:G});announce()}render()}
function freshPl(p){p.s=0;p.w="000000";p.p=0;p.k=-1;p.d=0;p.gw=0;p.x=0;return p}
function smallerTeam(){let a=0,b=0;for(const p of G.pl){if(p.t===0)a++;else if(p.t===1)b++}return a<=b?0:1}
function ensureTeams(){let ch=false;for(const p of G.pl)if(p.t!==0&&p.t!==1){p.t=smallerTeam();ch=true}return ch}
function shuffleTeams(){const first=Math.random()<.5?0:1;shuffled(G.pl).forEach((p,i)=>{p.t=(i+first)%2})}
function syncPlayers(){
  if(!G||mode!=="online")return;
  let changed=false;const act=IO.active();
  if(G.ph==="lobby"){const before=G.pl.length;G.pl=G.pl.filter(p=>act.has(p.i));if(G.pl.length!==before)changed=true}
  for(const p of peers){
    if(p.kind!=="viewer"||typeof p.presence.n!=="string")continue;
    const ex=plOf(p.peer),n=clean(p.presence.n)||"Oyuncu",c=(p.presence.c|0)%PCOL.length,tr=p.presence.tr;
    const trOk=tr&&typeof tr==="object"&&typeof tr.s==="number"&&(tr.t===0||tr.t===1);
    if(ex){
      if(ex.n!==n||ex.c!==c){ex.n=n;ex.c=c;changed=true}
      // takım değiştirme isteği: yalnızca lobide uygulanır
      if(trOk&&tr.s!==ex.ts&&G.ph==="lobby"){ex.t=tr.t;ex.ts=tr.s;changed=true}
    }
    else if(G.pl.length<MAXP&&G.ph!=="over"){const np=freshPl({i:p.peer,n,c});np.t=trOk?tr.t:smallerTeam();np.ts=trOk?tr.s:0;G.pl.push(np);changed=true}
  }
  if(ensureTeams())changed=true;
  if(changed)commit();
}
function teamTurn(t){
  const act=IO.active();
  for(const tt of [t,1-t]){
    const list=G.pl.filter(p=>p.t===tt&&act.has(p.i));
    if(list.length){G.tq[tt]=(G.tq[tt]+1)%list.length;const p=list[G.tq[tt]];G.tt=tt;G.pk=p.i;G.pi=G.pl.indexOf(p);return}
  }
}
function startGame(){
  if(!G)return;
  if(mode==="online"){const act=IO.active();G.pl=G.pl.filter(p=>act.has(p.i))}
  if(!G.pl.length)return;
  if(!validK(G.set.k))G.set.k=DEF_K.slice();
  if(kCount(G.set.k)<6){G.set.k=fullK(G.set.k);settings.k=G.set.k.slice();store.set("set",settings);toast("Boş dilimlere rastgele kategori kondu.")}
  G.pl.forEach(freshPl);G.seed=(Math.random()*2**31)|0;G.r=1;G.win=null;G.tie=false;G.tw=-1;G.fx=null;
  G.tm=[newTeam(),newTeam()];G.tq=[-1,-1];localAns={};localPick=null;
  if(teamOn()){ensureTeams();if(!G.pl.some(p=>p.t===0)||!G.pl.some(p=>p.t===1))shuffleTeams();teamTurn(Math.random()<.5?0:1)}
  else{G.pi=0;G.pk=G.pl[0].i}
  setPhase("pick",mode==="online"?12000:0);commit();
}
function autoCat(id){const w=wOf(plOf(id))||"000000";const need=[0,1,2,3,4,5].filter(i=>w[i]!=="2");const pool=need.length?need:[0,1,2,3,4,5];return pool[Math.floor(Math.random()*pool.length)]}
function pickQ(slot){
  const c=G.set.k[slot],all=byCat[c]&&byCat[c].length?byCat[c]:QS.map((_,i)=>i);
  const x=G.set.x,used=new Set(G.u),reg=i=>x==="mix"||(x==="t"?QS[i][1]==="t":QS[i][1]==="g");
  let pool=all.filter(i=>reg(i)&&!used.has(i));
  if(!pool.length)pool=all.filter(i=>!used.has(i));
  if(!pool.length)pool=all.slice();
  // Karışık'ta sorular yaklaşık %45 Türkiye ağırlıklı
  if(x==="mix"){const t=pool.filter(i=>QS[i][1]==="t"),g=pool.filter(i=>QS[i][1]==="g");if(t.length&&g.length)pool=Math.random()<.45?t:g}
  return pool[Math.floor(Math.random()*pool.length)];
}
function chooseCat(c){G.cat=c;G.qid=pickQ(c);G.u.push(G.qid);if(G.u.length>120)G.u=G.u.slice(-120);setPhase("cat",2100);commit()}
function toQuestion(){setPhase("q",G.set.t*1000);commit()}
function scoreRound(){
  const T=G.set.t*1000,tO=teamOn();let fastest=null,fms=1e9;
  for(const p of G.pl){
    const a=IO.ans(p.i);p.k=-1;p.d=0;p.gw=0;p.x=0;
    if(!a||a.r!==G.r||typeof a.c!=="number")continue;
    const pw=(a.p|0)&3,ff=(pw&1)&&!(p.p&1),dbl=(pw&2)&&!(p.p&2);
    p.p|=(ff?1:0)|(dbl?2:0);
    p.k=Math.max(0,Math.min(3,a.c|0));p.x=dbl?1:0;
    const ms=Math.max(0,Math.min(T,+a.ms||T));
    if(p.k===0){
      let pts=500+Math.round(500*(1-ms/T));if(dbl)pts*=2;
      p.s+=pts;p.d=pts;
      if(!tO){const w=+p.w[G.cat],nw=p.i===G.pk?2:Math.min(2,w+1);
        if(nw>w){p.w=p.w.slice(0,G.cat)+nw+p.w.slice(G.cat+1);p.gw=nw-w}}
      if(ms<fms){fms=ms;fastest=p.i}
    }else if(dbl){const loss=Math.min(300,p.s);p.s-=loss;p.d=-loss}
  }
  if(tO){
    // takımın en az yarısı doğru bilirse dilim takıma yazılır; puan, takımın tur ortalaması
    const act=IO.active(),pk=plOf(G.pk);
    G.tm.forEach((tm,ti)=>{
      const mem=G.pl.filter(p=>p.t===ti&&(act.has(p.i)||p.k>=0));
      const n=mem.length,c=mem.filter(p=>p.k===0).length;
      tm.n=n;tm.c=c;tm.gw=0;tm.ok=n>0&&c*2>=n;
      tm.d=n?Math.round(mem.reduce((s,p)=>s+p.d,0)/n):0;
      if(tm.s+tm.d<0)tm.d=-tm.s;tm.s+=tm.d;
      if(tm.ok){const w=+tm.w[G.cat],nw=pk&&pk.t===ti?2:Math.min(2,w+1);
        if(nw>w){tm.w=tm.w.slice(0,G.cat)+nw+tm.w.slice(G.cat+1);tm.gw=nw-w}}
    });
  }
  G.fx=fastest;setPhase("reveal",mode==="online"?7500:0);commit();
}
function nextRound(){
  const full=w=>w==="222222",tO=teamOn();
  if(G.set.m==="classic"){if((tO?G.tm.some(t=>full(t.w)):G.pl.some(p=>full(p.w)))||G.r>=40)return finish()}
  else if(G.r>=G.set.n)return finish();
  if(tO)teamTurn(1-G.tt);
  else{const act=IO.active(),n=G.pl.length;
    for(let k=1;k<=n;k++){const j=(G.pi+k)%n;if(mode==="local"||act.has(G.pl[j].i)){G.pi=j;G.pk=G.pl[j].i;break}}}
  G.r++;localAns={};localPick=null;
  setPhase("pick",mode==="online"?12000:0);commit();
}
function finish(){
  const cnt=w=>[...w].filter(c=>c==="2").length,cl=G.set.m==="classic";
  const key=x=>cl?[cnt(x.w),x.s]:[x.s,cnt(x.w)];
  const cmp=(a,b)=>{const A=key(a),B=key(b);return(B[0]-A[0])||(B[1]-A[1])};
  const tO=teamOn();
  const r=G.pl.slice().sort((a,b)=>tO?(b.s-a.s):cmp(a,b));
  G.win=r.map(p=>p.i);
  if(tO){const c=cmp(G.tm[0],G.tm[1]);G.tw=c<0?0:c>0?1:-1;G.tie=G.tw<0}
  else G.tie=r.length>1&&cmp(r[0],r[1])===0;
  setPhase("over",0);commit();
}
function toLobby(){G.ph="lobby";G.left=0;G.win=null;G.tie=false;G.tw=-1;G.tm=[newTeam(),newTeam()];if(mode==="online")G.pl=G.pl.filter(p=>IO.active().has(p.i));G.pl.forEach(freshPl);commit()}
function hostTick(){
  if(!G||!(isHost||mode==="local"))return;
  const now=Date.now();
  if(mode==="online")syncPlayers();
  const act=IO.active();
  if(G.ph==="pick"){
    const k=IO.pick(G.pk);
    if(k&&k.r===G.r&&k.cat>=0&&k.cat<6)return chooseCat(k.cat|0);
    if(mode==="online"&&(!act.has(G.pk)||now>hostDeadline))return chooseCat(autoCat(G.pk));
  }else if(G.ph==="cat"){if(now>=hostDeadline)toQuestion()}
  else if(G.ph==="q"){
    const need=mode==="local"?[G.pk]:G.pl.map(p=>p.i).filter(i=>act.has(i));
    const all=need.every(i=>{const a=IO.ans(i);return a&&a.r===G.r});
    if(all&&!allDoneAt)allDoneAt=now+800;
    if(now>hostDeadline+600||(allDoneAt&&now>=allDoneAt))scoreRound();
  }else if(G.ph==="reveal"){if(mode==="online"&&now>=hostDeadline)nextRound()}
}
function startLoop(){if(!loop)loop=setInterval(hostTick,200)}
function stopLoop(){clearInterval(loop);loop=null}

// ───────── online tesisat ─────────
function setMyPres(patch){Object.assign(myPres,patch);if(game)game.presence(patch).catch(()=>{})}
function announce(){
  if(!room||!isHost||mode!=="online"||!G)return;
  const info={code:G.code,n:clean(me.name)||"Ev sahibi",c:G.pl.length,st:G.ph==="lobby"?"open":"playing",tm:G.set.tm?1:0};
  const s=JSON.stringify(info);if(s!==lastAnn){lastAnn=s;room.presence({host:info}).catch(()=>{})}
}
function onGamePeers(ch){
  peers=ch.peers;peerMap=new Map(peers.map(p=>[p.peer,p]));
  const mine=peers.find(p=>p.sameTab);if(mine)myPeer=mine.peer;
  if(!isHost){
    let best=null;
    for(const p of peers){const g=p.presence&&p.presence.g;if(g&&typeof g==="object"&&Array.isArray(g.pl)&&(!best||g.v>best.v||(g.v===best.v&&p.peer<best.peer)))best=g}
    if(best){G=best;if(!validK(G.set&&G.set.k))G.set=Object.assign({},G.set,{k:DEF_K.slice()});if(!Array.isArray(G.tm))G.tm=[newTeam(),newTeam()];hostGoneAt=0}
  }else syncPlayers();
  render();

function migrateCheck(){
  if(mode!=="online"||isHost||!G)return;
  const hostThere=peers.some(p=>!p.sameTab&&p.presence&&p.presence.g);
  if(hostThere){hostGoneAt=0;return}
  const now=Date.now();if(!hostGoneAt){hostGoneAt=now;return}
  if(now-hostGoneAt<3500)return;
  const act=IO.active();const cands=G.pl.map(p=>p.i).filter(i=>act.has(i)).sort();
  if(cands[0]&&cands[0]===myPeer){
    isHost=true;G=JSON.parse(JSON.stringify(G));
    setPhase(G.ph,G.ph==="pick"?12000:G.ph==="q"?G.set.t*1000:G.ph==="cat"?1500:G.ph==="reveal"?6000:0);
    startLoop();commit();toast("Ev sahibi ayrıldı. Odayı artık sen yönetiyorsun.");
  }
}
setInterval(migrateCheck,700);

async function enterGame(c,asHost){
  if(!room)return;
  me.name=clean(me.name);if(!me.name){toast("Önce adını yaz.");const f=$("#nm");f&&f.focus();return}
  store.set("name",me.name);
  code=c.toUpperCase();mode="online";isHost=asHost;G=null;myPeer=null;peers=[];peerMap=new Map();myPres={};hostGoneAt=0;joinedAt=Date.now();
  render();
  try{game=await room.join("dilim-"+code.toLowerCase())}
  catch(e){game=null;mode="home";render();toast(e&&e.code==="limit_reached"?"Şu an çok fazla oda açık. Birazdan tekrar dene.":"Oda açılamadı. Tekrar dene.");return}
  myPres={n:me.name,c:me.col};
  if(asHost){G=newG();myPres.g=G;startLoop()}
  game.presence(myPres).catch(()=>{});
  unsubPeers=game.onPeers(onGamePeers,()=>{toast("Odayla bağlantı koptu.");leave(true)});
  if(asHost)announce();

}
function leave(silent){
  try{unsubPeers&&unsubPeers()}catch(e){}
  if(game)game.leave().catch(()=>{});
  if(room&&isHost)room.presence({host:null}).catch(()=>{});
  game=null;unsubPeers=null;stopLoop();isHost=false;G=null;mode="home";lastAnn="";localAns={};localPick=null;
  render();
}

function pickCat(c){
  if(!G||G.ph!=="pick"||ui.picked)return;
  if(myId()!==G.pk)return;
  ui.picked=true;beep(SND.pick);
  if(mode==="local")localPick={r:G.r,cat:c};else setMyPres({k:{r:G.r,cat:c}});
  render();hostTick();
}
function answer(orig){
  if(!G||G.ph!=="q"||ui.ans)return;
  const id=myId(),p=plOf(id);if(!p)return;
  const a={r:G.r,c:orig,ms:Date.now()-ui.phaseStart,p:(ui.ff?1:0)|(ui.dbl?2:0)};
  ui.ans=a;beep(SND.tick);
  if(mode==="local")localAns[id]=a;else setMyPres({a});
  render();
}
function switchTeam(id){
  const p=plOf(id||myPeer);if(!p||G.ph!=="lobby")return;
  if(isHost){p.t=p.t===1?0:1;commit()}
  else if(p.i===myPeer)setMyPres({tr:{t:p.t===1?0:1,s:Date.now()}});
}
function optOrder(){return shuffled([0,1,2,3],rng((G.seed^Math.imul(G.qid+7,2654435761))>>>0))}
function ffGone(){const r=rng((G.seed+G.qid*31+5)>>>0);return shuffled([1,2,3],r).slice(0,2)}

const main=$("#main");
let cur={key:null,upd:null};
function screenKey(){
  if(mode==="home")return"home";
  if(mode==="localsetup")return"localsetup";
  if(!G)return"waiting";
  if(G.ph==="lobby")return"lobby";
  return G.ph+":"+G.r+(G.ph==="over"?":"+G.v:"");
}
function render(){
  if(G){const pk=G.ph+":"+G.r+":"+G.qid;
    if(pk!==ui.phaseKey){const prev=ui.phaseKey;ui.phaseKey=pk;ui.phaseStart=Date.now();
      if(G.ph==="q"){ui.ans=null;ui.ff=false;ui.dbl=false;if(prev)beep(SND.go)}
      if(G.ph==="pick")ui.picked=false;
      if(G.ph==="reveal"){const p=plOf(myId());if(p&&p.k>=0)beep(p.k===0?SND.ok:SND.no)}
      if(G.ph==="over")beep(SND.win);
    }}
  renderTop();
  const key=screenKey();
  if(key!==cur.key||cur.rebuild){cur.key=key;cur.rebuild=false;main.replaceChildren();const b=BUILD[key.split(":")[0]];cur.upd=b?b(main)||null:null}
  if(cur.upd)cur.upd();
}

    h("div",{class:"center"},
      mode==="local"?h("div",{class:"pass"},tL?`Telefonu şu takıma verin: ${pk?pk.n:""}`:`Telefonu şu kişiye ver: ${pk?pk.n:""}`):null,
      h("h2",{class:"display pick-h"},title),
      tO&&pk?h("span",{class:"tpill",style:`--tc:${TEAMS[pk.t].c}`},`${TEAMS[pk.t].n} takımı için`):null,
      sub,holder,mine?spin:null),
    playerStrip());
  holder.innerHTML=wheelSVG({live:mine,w:wOf(pk)});
  if(mine)holder.querySelectorAll(".slice").forEach(s=>{const c=+s.dataset.cat;s.addEventListener("click",()=>pickCat(c));s.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickCat(c)}})});
  return()=>{
    let t;
    if(mine&&ui.picked)t="Çark dönüyor…";
    else if(mine)t=tO?"Takımının en az yarısı doğru bilirse dilimin tamamı takımına yazılır.":tL?"Doğru bilirseniz dilimin tamamı sizin.":mode==="local"?"Doğru bilirsen dilimin tamamı senin.":"Doğru bilirsen dilimin tamamı senin. Diğerleri yarımı için oynar.";
    else if(tO&&meP&&pk)t=meP.t===pk.t?"Takım arkadaşın seçiyor. Yarınız doğru bilirse tam dilim!":"Rakip takım seçiyor. Yarınız doğru bilirse yarım dilim kaparsınız.";
    else t="Bu soruyu herkes cevaplar. Doğru cevap yarım dilim kazandırır.";
    sub.textContent=t;spin.disabled=ui.picked;
  };
},
cat(root){
  const c=G.cat,holder=h("div"),C=CATS[G.set.k[c]];
  add(root,
    h("div",{class:"qhead"},h("span",{class:"eyebrow"},`Tur ${G.r}`)),
    h("div",{class:"center"},holder,h("div",{class:"catpill",style:`--cat:var(--c${c})`,id:"catpill"},catLabel(C))),
    playerStrip());
  holder.innerHTML=wheelSVG({});
  const rot=holder.querySelector(".rot"),target=-(c*60+30)-1080;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{rot.style.transform=`rotate(${target}deg)`}));
},
q(root){
  const q=QS[G.qid],c=G.cat,ord=optOrder(),gone=ffGone(),C=CATS[G.set.k[c]];
  root.style.setProperty("--cat",`var(--c${c})`);
  const btns=ord.map((o,idx)=>h("button",{class:"opt",type:"button","data-o":o,onclick:()=>answer(o)},h("span",{class:"l"},"ABCD"[idx]),h("span",{class:"t"},q[3+o])));
  const ffB=h("button",{class:"pwb",type:"button",onclick:()=>{ui.ff=true;render()}},h("b",{},"50:50"),"İki şık sil");
  const dbB=h("button",{class:"pwb",type:"button",onclick:()=>{ui.dbl=!ui.dbl;render()}},h("b",{},"×2"),"Ya hep ya hiç");
  const status=h("div",{class:"status",role:"status"});const stripBox=h("div");
  const me_=plOf(myId());
  add(root,
    h("div",{class:"qhead"},h("span",{class:"catpill"},catLabel(C)),h("span",{class:"eyebrow"},`Tur ${G.r}`+(mode==="local"&&plOf(G.pk)?` · ${plOf(G.pk).n}`:"")),h("div",{class:"timer","data-timer":"num"})),
    h("div",{class:"tbar","data-timer":"bar"},h("i")),
    h("h2",{class:"qtext"},q[2]),
    h("div",{class:"opts"},btns),
    me_?h("div",{class:"pw"},ffB,dbB):null,
    status,stripBox);
  return()=>{
    const p=plOf(myId());const locked=!!ui.ans;
    for(const b of btns){const o=+b.dataset.o;b.disabled=!p||locked;b.classList.toggle("gone",ui.ff&&gone.includes(o));b.classList.toggle("chosen",locked&&ui.ans.c===o)}
    if(p){ffB.disabled=locked||ui.ff||!!(p.p&1);ffB.setAttribute("aria-pressed",String(ui.ff));
      dbB.disabled=locked||!!(p.p&2);dbB.setAttribute("aria-pressed",String(ui.dbl));
      if(p.p&1&&!ui.ff)ffB.title="Zaten kullanıldı";if(p.p&2)dbB.title="Zaten kullanıldı"}
    const n=G.pl.filter(x=>{const a=IO.ans(x.i);return a&&a.r===G.r}).length;
    status.replaceChildren();
    if(!p)status.append("Bu turu izliyorsun.");
    else if(locked)status.append(h("b",{},"Kilitlendi."),mode==="online"?` Diğerleri bekleniyor · ${n}/${IO.active().size} cevapladı`:"");
    else if(ui.dbl)status.append(h("b",{},"Ya hep ya hiç açık."));
    stripBox.replaceChildren(playerStrip({answered:mode==="online"}));
  };
},
reveal(root){
  const q=QS[G.qid],c=G.cat,ord=optOrder(),mine=myId(),tO=teamOn(),tL=teamLocal(),C=CATS[G.set.k[c]];
  root.style.setProperty("--cat",`var(--c${c})`);
  const mp=plOf(mine);
  const opts=ord.map((o,idx)=>{let cls="opt";if(o===0)cls+=" correct";else if(mp&&mp.k===o)cls+=" wrong";else cls+=" dim";
    const who=G.pl.filter(p=>p.k===o);
    return h("div",{class:cls},h("span",{class:"l"},"ABCD"[idx]),h("span",{class:"t"},q[3+o]),who.length&&mode==="online"?h("span",{class:"who"},who.map(disc)):null)});
  let head;
  if(mp&&mp.k===0)head=`${pickOne(tL?["Doğru!","Bildiniz!","Kralsınız!","Efsane!","Aura +1000"]:["Doğru!","Bildin!","Kralsın!","Efsane!","Aura +1000"])} +${fmt(mp.d)}`;
  else if(mp&&mp.k>0)head=mp.d<0?`Yanlış. ×2 cezası: ${sign(mp.d)}`:pickOne(["Olmadı be","Yanlış!","Bu sefer olmadı","Aura −500","Yok artık"]);
  else if(mp)head="Süre doldu";else head="Cevap";
  // tek cihazda turu yalnızca sırası gelen oynar
  const rows=(mode==="local"?[plOf(G.pk)].filter(Boolean):G.pl.slice().sort((a,b)=>(b.d-a.d)||(b.s-a.s))).map(p=>{
    const note=tO?(p.k===0?"Doğru":p.k>0?"Yanlış":"Cevap yok")
      :p.k===0?(p.gw===2?`Tam ${C.n} dilimi`:p.gw===1?"Yarım dilim":"Bu dilim zaten vardı"):p.k>0?"Yanlış cevap":"Cevap yok";
    return h("div",{class:"res"},disc(p),h("span",{class:"nm"},p.n,tO?teamDot(p.t):null,p.i===G.fx&&mode==="online"?h("span",{class:"badge"},"En hızlı"):null,p.x&&p.k>=0?h("span",{class:"badge"},"×2"):null),
      h("span",{class:"d "+(p.d>0?"pos":p.d<0?"neg":"")},sign(p.d)),
      h("span",{class:"note"},note))});
  const foot=h("div",{class:"row"});
  add(root,
    h("div",{class:"qhead"},h("span",{class:"catpill"},catLabel(C)),h("span",{class:"eyebrow"},`Tur ${G.r}`),h("div",{class:"timer","data-timer":"num"})),
    h("h2",{class:"display",style:`font-size:clamp(26px,6vw,40px);color:${mp&&mp.k===0?"var(--good)":"var(--paper)"}`},head),
    h("p",{class:"qtext",style:"font-size:clamp(18px,3.6vw,22px);color:var(--muted)"},q[2]),
    h("div",{class:"opts"},opts),
    tO?teamCards({reveal:true}):null,
    h("div",{class:"results"},rows),
    foot,playerStrip({noTeams:true}));
  if(mode==="local"){
    const nextP=G.pl[(G.pi+1)%G.pl.length];
    foot.append(h("button",{class:"btn big",type:"button",onclick:nextRound},`Devam · Sıra: ${nextP?nextP.n:"sonraki"}`));
  }else foot.append(h("span",{class:"muted"},"Sonraki tur birazdan…"));
},
over(root){
  const ranked=(G.win||[]).map(plOf).filter(Boolean),tO=teamOn(),cl=G.set.m==="classic";
  const cnt=x=>[...(x||"")].filter(c=>c==="2").length;
  const rankRow=(i,first,dot,name,w,score,extra)=>h("div",{class:"rank"+(first?" first":"")},
    h("span",{class:"n"},String(i+1)),dot,h("span",{style:"font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},name,extra||null),w!=null?pieEl(w,28):h("span"),h("span",{class:"sc"},fmt(score)));
  let hero,eyebrow,title,list;
  if(tO){
    const tw=G.tw,T=tw>=0?G.tm[tw]:null;
    hero=pieEl(T?T.w:"000000",120);
    eyebrow=cl?(T&&cnt(T.w)===6?"Altı dilimin hepsi":"En çok dilim"):"En yüksek puan";
    title=G.tie?"Berabere!":`${TEAMS[tw].n} kazandı!`;
    const order=tw===1?[1,0]:[0,1];
    list=[h("div",{class:"podium"},order.map((ti,i)=>rankRow(i,!G.tie&&i===0,h("div",{class:"disc",style:`background:${TEAMS[ti].c}`},TEAMS[ti].n[0]),TEAMS[ti].n,G.tm[ti].w,G.tm[ti].s))),
      h("div",{class:"eyebrow",style:"margin-top:6px"},"Oyuncular"),
      h("div",{class:"podium"},ranked.map((p,i)=>rankRow(i,false,disc(p),p.n,null,p.s,[teamDot(p.t),i===0&&p.s>0?h("span",{class:"badge"},"MVP"):null])))];
  }else{
    const w=ranked[0];
    hero=w?pieEl(w.w,120):null;
    eyebrow=cl?(cnt(w&&w.w)===6?"Altı dilimin hepsi":"En çok dilim"):"En yüksek puan";
    title=G.tie?"Berabere!":w?`${w.n} kazandı!`:"Oyun bitti";
    list=[h("div",{class:"podium"},ranked.map((p,i)=>rankRow(i,!G.tie&&i===0,disc(p),p.n,p.w,p.s)))];
  }
  add(root,
    h("div",{class:"center",style:"padding-block:10px"},hero,h("div",{class:"eyebrow"},eyebrow),
      h("h2",{class:"display",style:"font-size:clamp(34px,8vw,60px)"},title)),
    ...list,
    h("div",{class:"row",style:"justify-content:center"},
      (isHost||mode==="local")?[
        h("button",{class:"btn big",type:"button",onclick:startGame},"Rövanş"),
        mode==="local"?h("button",{class:"btn ghost",type:"button",onclick:()=>{stopLoop();G=null;mode="localsetup";render()}},"Oyuncuları değiştir")
          :h("button",{class:"btn ghost",type:"button",onclick:toLobby},"Lobiye dön")]
      :h("span",{class:"muted"},"Ev sahibinin rövanşı başlatması bekleniyor…")));
}
};

// zamanlayıcı
function frame(){
  if(G&&(G.ph==="q"||G.ph==="pick"||G.ph==="reveal")&&G.left){
    const rem=Math.max(0,ui.phaseStart+G.left-Date.now()),p=rem/G.left;
    document.querySelectorAll('[data-timer="bar"]').forEach(b=>{b.style.setProperty("--p",p.toFixed(3));b.classList.toggle("low",G.ph==="q"&&rem<5000)});
    document.querySelectorAll('[data-timer="num"]').forEach(n=>{n.textContent=G.ph==="reveal"?"":Math.ceil(rem/1000)+" sn"});
  }else document.querySelectorAll('[data-timer="num"]').forEach(n=>{n.textContent=""});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// klavye: A–D ya da 1–4 ile cevap
document.addEventListener("keydown",e=>{
  if(!G||G.ph!=="q"||ui.ans||e.target.closest("input"))return;
  const k=e.key.toLocaleUpperCase("en");let idx="ABCD".indexOf(k);if(idx<0)idx="1234".indexOf(k);if(idx<0)return;
  const o=optOrder()[idx];if(ui.ff&&ffGone().includes(o))return;answer(o);
});
// bekleme metnini tazele
setInterval(()=>{if(cur.key==="waiting"&&cur.upd)cur.upd()},1000);
render();
(async()=>{
  try{room=window.claude&&window.claude.use?await window.claude.use("room"):window.KNet?await window.KNet.use("room"):null}catch(e){room=null}
  if(room){room.onPeers(()=>{if(mode==="home")render()},()=>{room=null;if(mode==="home")render()})}
  if(mode==="home")render();
})();
</script>
