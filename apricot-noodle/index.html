<style>
/* Layout: one-screen arcade cabinet — plum chrome top & bottom, bright orchard diorama canvas in the middle. Single committed look. */
:root {
  --plum: #2a1d3d;
  --plum-2: #3b2a55;
  --plum-3: #54406f;
  --apricot: #ff9a3c;
  --apricot-deep: #e9702a;
  --leaf: #7fd16e;
  --paper: #fffaf2;
  --ink: #2a1d3d;
  --muted: #b9a9d4;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--plum); color: var(--paper); font-family: var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--apricot); outline-offset: 2px; }

.bar {
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--plum);
}
.brand { font-family: var(--display); font-size: 22px; line-height: 1; color: var(--apricot); letter-spacing: 0.01em; white-space: nowrap; }
.brand span { color: var(--leaf); }
.lvl { display: flex; flex-direction: column; min-width: 0; flex: 1; padding-left: 12px; border-left: 2px solid var(--plum-3); }
.lvl small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 800; }
.lvl b { font-weight: 900; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 800; }
.stat b { font-size: 18px; font-weight: 900; line-height: 1.1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: var(--plum-2); font-weight: 800; font-size: 14px; }
.chip:hover { background: var(--plum-3); }
.chip svg { width: 18px; height: 18px; }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }

.controls {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--plum);
}
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border-radius: 14px; background: var(--plum-2); font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.tool:hover { background: var(--plum-3); }
.tool:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); }
.tool svg { width: 20px; height: 20px; flex: none; }
.tool kbd { font-family: var(--ui); font-size: 11px; font-weight: 900; color: var(--muted); border: 1.5px solid var(--plum-3); border-radius: 5px; padding: 0 5px; }
.keys { font-size: 13px; color: var(--muted); font-weight: 700; }
.keys kbd { font-family: var(--ui); font-weight: 900; color: var(--paper); border: 1.5px solid var(--plum-3); border-radius: 5px; padding: 0 5px; margin: 0 1px; }

.pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 44px); gap: 6px; }
.pad button { border-radius: 12px; background: var(--apricot); color: var(--ink); display: grid; place-items: center; box-shadow: inset 0 -4px 0 var(--apricot-deep); }
.pad button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--apricot-deep); }
.pad button svg { width: 22px; height: 22px; }
.pad .u { grid-column: 2; grid-row: 1; }
.pad .l { grid-column: 1; grid-row: 2; }
.pad .d { grid-column: 2; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; }
.pad button.hinted { animation: hintPulse .5s ease-in-out 4 alternate; }
@keyframes hintPulse { to { background: var(--leaf); box-shadow: inset 0 -4px 0 #4e9a42, 0 0 0 4px rgba(127,209,110,.45); } }
.tool.hinted { animation: none; }

.toast {
  position: absolute; left: 50%; top: 14px; transform: translate(-50%, -8px); opacity: 0;
  background: var(--plum); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
  transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.panel-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(42, 29, 61, .45); }
.panel {
  width: min(420px, 100%); background: var(--paper); color: var(--ink); border-radius: 22px; padding: 22px 22px 20px;
  box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 20px 50px rgba(20,10,40,.35); text-align: center;
  animation: pop .28s cubic-bezier(.2,1.4,.4,1);
  max-height: 100%; overflow: auto;
}
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0 0 6px; color: var(--apricot-deep); text-wrap: balance; }
.panel p { margin: 0 0 16px; font-weight: 700; color: #5b4c72; }
.panel .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { height: 46px; padding: 0 20px; border-radius: 14px; font-weight: 900; font-size: 16px; background: #ece4f6; color: var(--ink); box-shadow: inset 0 -3px 0 #d3c7e3; }
.btn.primary { background: var(--apricot); box-shadow: inset 0 -4px 0 var(--apricot-deep); }
.btn:active { transform: translateY(1px); }
.score { display: flex; justify-content: center; gap: 22px; margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
.score div { display: flex; flex-direction: column; }
.score small { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 900; color: #8a7aa3; }
.score b { font-size: 26px; font-weight: 900; }
.badge { display: inline-block; margin-bottom: 14px; padding: 4px 12px; border-radius: 999px; background: #e3f6dc; color: #2f6b27; font-weight: 900; font-size: 13px; }

.panel.wide { width: min(760px, 100%); }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 10px 0 16px; text-align: left; }
.chapter { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 2px 0; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: #8a7aa3; }
.chapter:first-child { margin-top: 0; }
.chapter span { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.lv { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #f2ecf8; color: var(--ink); min-width: 0; }
.lv:hover { background: #e6dcf2; }
.lv.current { outline: 2.5px solid var(--apricot); }
.lv .n { flex: none; width: 32px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--plum); color: var(--paper); font-weight: 900; font-size: 13px; font-variant-numeric: tabular-nums; }
.lv.done .n { background: var(--leaf); color: #1f4a19; }
.lv .t { display: flex; flex-direction: column; min-width: 0; }
.lv .t b { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv .t small { font-size: 12px; font-weight: 700; color: #7a6a93; font-variant-numeric: tabular-nums; }

.rules { text-align: left; margin: 0 0 16px; padding: 0; list-style: none; display: grid; gap: 8px; font-weight: 700; color: #4d3e66; font-size: 15px; }
.rules li { display: flex; gap: 10px; align-items: flex-start; }
.rules i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 900; color: var(--paper); background: var(--plum-3); margin-top: 1px; }

@media (max-width: 640px) {
  .brand { display: none; }
  .lvl { border-left: 0; padding-left: 0; }
  .keys { display: none; }
  .tool .lbl, .tool kbd { display: none; }
  .tool { padding: 0 13px; }
  .chip .lbl { display: none; }
  .chip { padding: 0 10px; }
}
@media (min-width: 641px) and (pointer: fine) {
  .pad { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 36px); }
}
@media (prefers-reduced-motion: reduce) {
  .panel { animation: none; }
  .pad button.hinted { animation: none; background: var(--leaf); }
}

<script>
// Shared engine: parse + step. Also used by solver.
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function parseLevel(def) {
  const rows = def.map;
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const grid = [];
  const fruits = [];
  let exit = null;
  const segs = {};
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = rows[y][x] || '.';
      let t = 0;
      if (c === '#') t = 1;
      else if (c === '^') t = 2;
      else if (c === 'F') fruits.push([x, y]);
      else if (c === 'X') exit = [x, y];
      else if (c === 'H') segs[0] = [x, y];
      else if (/[1-9]/.test(c)) segs[+c] = [x, y];
      grid.push(t);
    }
  }
  const snake = Object.keys(segs).map(Number).sort((a, b) => a - b).map(k => segs[k]);
  return { w, h, grid, fruits, exit, start: { snake, mask: (1 << fruits.length) - 1 } };
}

function cell(L, x, y) {
  if (x < 0 || x >= L.w || y < 0) return 1; // sides and top are walls
  if (y >= L.h) return -1; // void below
  return L.grid[y * L.w + x];
}
function fruitAt(L, mask, x, y) {
  for (let i = 0; i < L.fruits.length; i++)
    if ((mask >> i) & 1 && L.fruits[i][0] === x && L.fruits[i][1] === y) return i;
  return -1;
}

// returns {result, state, fall}
function step(L, s, dir) {
  const [dx, dy] = DIRS[dir];
  const head = s.snake[0];
  const nx = head[0] + dx, ny = head[1] + dy;
  const c = cell(L, nx, ny);
  if (c === 1 || c === -1) return { result: 'blocked' };
  if (s.snake.some(p => p[0] === nx && p[1] === ny)) return { result: 'blocked' };
  let mask = s.mask;
  let snake;
  const fi = fruitAt(L, mask, nx, ny);
  if (fi >= 0) {
    mask &= ~(1 << fi);
    snake = [[nx, ny], ...s.snake.map(p => [p[0], p[1]])];
  } else {
    snake = [[nx, ny], ...s.snake.slice(0, -1).map(p => [p[0], p[1]])];
  }
  const ate = fi >= 0;
  if (c === 2) return { result: 'dead', state: { snake, mask }, fall: 0, ate };
  if (mask === 0 && L.exit && nx === L.exit[0] && ny === L.exit[1])
    return { result: 'win', state: { snake, mask }, fall: 0, ate };
  // gravity
  let fall = 0;
  while (true) {
    let supported = false;
    for (const [x, y] of snake) {
      const b = cell(L, x, y + 1);
      if (b === 1 || (b === 0 && fruitAt(L, mask, x, y + 1) >= 0)) {
        if (!snake.some(p => p[0] === x && p[1] === y + 1)) { supported = true; break; }
      }
    }
    if (supported) break;
    // fall one
    for (const p of snake) p[1]++;
    fall++;
    let dead = false;
    for (const [x, y] of snake) {
      const cc = cell(L, x, y);
      if (cc === 2) dead = true;
    }
    if (dead) return { result: 'dead', state: { snake, mask }, fall, ate };
    if (snake.every(p => p[1] >= L.h)) return { result: 'dead', state: { snake, mask }, fall, ate, void: true };
    if (fall > L.h + 20) return { result: 'dead', state: { snake, mask }, fall, ate, void: true };
    if (mask === 0 && L.exit && snake[0][0] === L.exit[0] && snake[0][1] === L.exit[1])
      return { result: 'win', state: { snake, mask }, fall, ate };
  }
  return { result: 'ok', state: { snake, mask }, fall, ate };
}

if (typeof module !== 'undefined') module.exports = { parseLevel, step, DIRS };

// ---------- solver (par + hints) ----------
function skey(s) { return s.mask + '|' + s.snake.map(p => p[0] + ',' + p[1]).join(';'); }
function solveFrom(L, start, cap = 250000) {
  const q = [[start, null]]; const seen = new Set([skey(start)]); let i = 0;
  const dirsList = ['up', 'down', 'left', 'right'];
  while (i < q.length) {
    const node = q[i++]; const s = node[0];
    for (const d of dirsList) {
      const r = step(L, s, d);
      if (r.result === 'blocked' || r.result === 'dead') continue;
      const nn = [r.state, node, d];
      if (r.result === 'win') { const path = []; let n = nn; while (n[1]) { path.push(n[2]); n = n[1]; } return path.reverse(); }
      const k = skey(r.state); if (seen.has(k)) continue; seen.add(k);
      if (seen.size > cap) return undefined;
      q.push(nn);
    }
  }
  return null;
}

// ---------- persistence ----------
const STORE = 'apricot-noodle-v1';
let progress = { best: {} };
try { const raw = localStorage.getItem(STORE); if (raw) progress = Object.assign({ best: {} }, JSON.parse(raw)); } catch (e) {}
function saveProgress() { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} }

// ---------- audio ----------
let actx = null, muted = false;
try { muted = localStorage.getItem(STORE + '-muted') === '1'; } catch (e) {}
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay; const o = a.createOscillator(); const g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  step() { tone(320 + Math.random() * 40, 0.06, 'triangle', 0.06); },
  bump() { tone(140, 0.09, 'square', 0.04, -40); },
  chomp() { tone(520, 0.08, 'triangle', 0.12, 260); tone(780, 0.1, 'sine', 0.08, 200, 0.06); },
  land() { tone(110, 0.12, 'sine', 0.14, -40); },
  bloom() { [523, 659, 784].forEach((f, i) => tone(f, 0.25, 'sine', 0.07, 0, i * 0.07)); },
  win() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.3, 'triangle', 0.08, 0, i * 0.08)); },
  die() { tone(300, 0.4, 'sawtooth', 0.05, -220); },
};

// ---------- game state ----------
let li = 0, L = null, cur = null, history = [], over = null, anim = null, queued = null;
let parCache = {}, hintPath = null;
let particles = [], bumpFx = null, hintFx = null, deadFx = 0, bloomT = -1;

function loadLevel(i, restore) {
  li = Math.max(0, Math.min(LEVELS.length - 1, i));
  L = parseLevel(LEVELS[li]);
  cur = restore && restore.cur ? restore.cur : cloneState(L.start);
  history = restore && restore.history ? restore.history : [];
  over = null; anim = null; queued = null; particles = []; hintFx = null; bloomT = cur.mask === 0 ? 0 : -1;
  closePanel();
  $('lvlNum').textContent = `Level ${li + 1} of ${LEVELS.length}`;
  $('lvlName').textContent = LEVELS[li].name;
  if (!(li in parCache)) { const p = solveFrom(L, L.start); parCache[li] = p ? p.length : null; }
  $('par').textContent = parCache[li] ?? '–';
  updateMoves();
  layout();
}
function cloneState(s) { return { snake: s.snake.map(p => [p[0], p[1]]), mask: s.mask }; }
function updateMoves() { $('moves').textContent = history.length; }

function tryMove(dir) {
  audio();
  if (over) { if (over === 'dead') toast('Undo (Z) or restart (R) to keep going'); return; }
  if (anim) { queued = dir; return; }
  const r = step(L, cur, dir);
  if (r.result === 'blocked') { bumpFx = { dir, t0: performance.now() }; sfx.bump(); return; }
  hintFx = null; clearHintPad();
  history.push(cloneState(cur));
  updateMoves();
  const pre = r.state.snake.map(p => [p[0], p[1] - r.fall]);
  let visFall = r.fall;
  if (r.void) visFall += 4;
  anim = { old: cur.snake, oldMask: cur.mask, pre, grow: r.ate, fall: visFall, realFall: r.fall, result: r.result, dir, t0: performance.now(), phase: 'move', final: r.state, voidDeath: !!r.void };
  if (r.ate) { const h = r.state.snake[0]; setTimeout(() => { burst(h[0] + .5, h[1] - r.fall + .5, ['#ffb35c', '#ff8a2a', '#ffd89a', '#7fd16e'], 14); }, 70); sfx.chomp(); }
  else sfx.step();
  cur = r.state;
}

function finishAnim() {
  const a = anim; anim = null;
  if (!a) return;
  if (a.oldMask !== 0 && cur.mask === 0) { bloomT = performance.now(); sfx.bloom(); const e = L.exit; burst(e[0] + .5, e[1] + .5, ['#ffd1e0', '#ff9ec0', '#fff', '#ffb35c'], 20); }
  if (a.result === 'dead') { over = 'dead'; deadFx = performance.now(); sfx.die(); setTimeout(() => { if (over === 'dead') showDeath(a.voidDeath); }, 420); return; }
  if (a.result === 'win') { over = 'win'; sfx.win(); winFx(); setTimeout(showWin, 650); return; }
  if (queued) { const q = queued; queued = null; tryMove(q); }
}

function undo() {
  audio();
  if (anim) { anim = null; }
  queued = null;
  if (!history.length) { toast('Nothing to undo'); return; }
  cur = history.pop(); over = null; closePanel(); hintFx = null; clearHintPad();
  bloomT = cur.mask === 0 ? 0 : -1;
  updateMoves();
}
function restart() { audio(); loadLevel(li); }

function hint() {
  audio();
  if (over === 'win') return;
  if (over === 'dead') { toast('Undo first — this noodle is out of moves'); return; }
  const path = solveFrom(L, cur);
  if (path === null) { toast('No way out from here. Try undoing a few moves.'); return; }
  if (path === undefined) { toast('Too tangled to read — try undoing a bit'); return; }
  const d = path[0];
  hintFx = { dir: d, t0: performance.now() };
  clearHintPad();
  const b = document.querySelector(`.pad [data-dir="${d}"]`); if (b) b.classList.add('hinted');
  toast(`Try ${d} · ${path.length} move${path.length > 1 ? 's' : ''} from the flower`);
}
function clearHintPad() { document.querySelectorAll('.pad .hinted').forEach(b => b.classList.remove('hinted')); }

// ---------- panels ----------
function openPanel(html, wide) { $('panel').innerHTML = html; $('panel').classList.toggle('wide', !!wide); $('panelWrap').hidden = false; const f = $('panel').querySelector('.primary, button'); if (f) f.focus({ preventScroll: true }); }
function closePanel() { $('panelWrap').hidden = true; $('panel').innerHTML = ''; }
function panelOpen() { return !$('panelWrap').hidden; }

function showDeath(voidDeath) {
  const msgs = voidDeath ? ['Into the mist!', 'Noodle fell off the world. One undo and it never happened.'] : ['Prickly!', 'Brambles are not a snack. Undo and find another way.'];
  openPanel(`<h2>${msgs[0]}</h2><p>${msgs[1]}</p><div class="row"><button class="btn primary" data-act="undo">Undo</button><button class="btn" data-act="restart">Restart</button></div>`);
}
function showWin() {
  const moves = history.length, par = parCache[li];
  const prev = progress.best[li];
  const isBest = prev == null || moves < prev;
  if (isBest) { progress.best[li] = moves; saveProgress(); }
  const last = li === LEVELS.length - 1;
  const atPar = par != null && moves <= par;
  const allDone = LEVELS.every((_, i) => progress.best[i] != null);
  const title = last ? (allDone ? 'Orchard cleared!' : 'Summit reached!') : 'Bloom!';
  const sub = last ? (allDone ? 'Every apricot eaten, every flower open. Try matching par on the ones you missed.' : 'You topped the final level. A few earlier levels are still waiting.') : `${LEVELS[li].name} is done.`;
  openPanel(`<h2>${title}</h2><p>${sub}</p>
    <div class="score"><div><small>Moves</small><b>${moves}</b></div><div><small>Par</small><b>${par ?? '–'}</b></div><div><small>Best</small><b>${progress.best[li]}</b></div></div>
    ${atPar ? '<span class="badge">Par matched — perfect route</span>' : ''}
    <div class="row">${last ? '<button class="btn primary" data-act="levels">All levels</button>' : '<button class="btn primary" data-act="next">Next level</button>'}<button class="btn" data-act="restart">Replay</button></div>`);
}
const CHAPTERS = ['Orchard', 'Meadow', 'Hedgerow', 'Bramble Wood', 'Cloud Garden', 'Cellar', 'Windmill Hill', 'Misty Terraces', 'Thorn Keep', 'High Orchard', 'Summit Grove'];
function showLevels() {
  const items = LEVELS.map((lv, i) => {
    const b = progress.best[i]; const par = parCache[i];
    let head = '';
    if (i % 10 === 0) {
      const end = Math.min(LEVELS.length, i + 10);
      let done = 0; for (let k = i; k < end; k++) if (progress.best[k] != null) done++;
      head = `<div class="chapter">${CHAPTERS[i / 10] || 'Chapter ' + (i / 10 + 1)}<span>${i + 1}–${end} · ${done}/${end - i}</span></div>`;
    }
    return head + `<button class="lv ${b != null ? 'done' : ''} ${i === li ? 'current' : ''}" data-act="go" data-i="${i}"><span class="n">${b != null ? '✓' : i + 1}</span><span class="t"><b>${lv.name}</b><small>${b != null ? `Best ${b}${par != null ? ' · par ' + par : ''}` : 'Not cleared'}</small></span></button>`;
  }).join('');
  openPanel(`<h2>Levels</h2><div class="levels">${items}</div><div class="row"><button class="btn" data-act="rules">How to play</button>${window.KQuit && KQuit.onSite ? `<button class="btn" data-act="quit">${KQuit.LABEL}</button>` : ''}<button class="btn primary" data-act="close">Back to game</button></div>`, true);
  const curBtn = $('panel').querySelector('.lv.current');
  if (curBtn) curBtn.scrollIntoView({ block: 'center' });
}
function showRules(first) {
  openPanel(`<h2>${first ? 'Apricot Noodle' : 'How to play'}</h2>
    <ul class="rules">
      <li><i>1</i><span>Slither with the arrows. Noodle can't reverse into itself.</span></li>
      <li><i>2</i><span>Each apricot makes Noodle one segment longer.</span></li>
      <li><i>3</i><span>Gravity is real: if no part of Noodle rests on ground or fruit, it falls.</span></li>
      <li><i>4</i><span>Eat every apricot and the flower blooms. Slither into it to win.</span></li>
      <li><i>5</i><span>Brambles and the misty drop are fatal, but Undo is free.</span></li>
    </ul>
    <div class="row"><button class="btn primary" data-act="close">${first ? 'Start slithering' : 'Got it'}</button></div>`);
}
$('panel').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; audio();
  const act = b.dataset.act;
  if (act === 'undo') undo();
  else if (act === 'restart') restart();
  else if (act === 'next') loadLevel(li + 1);
  else if (act === 'levels') showLevels();
  else if (act === 'go') loadLevel(+b.dataset.i);
  else if (act === 'rules') showRules(false);
  else if (act === 'close') closePanel();
  else if (act === 'quit') KQuit.go();
});

let toastTimer = null;

const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (panelOpen()) {
    if (e.key === 'Escape' && over !== 'win' && over !== 'dead') { closePanel(); e.preventDefault(); return; }

    if (dead) {
      ctx.strokeStyle = '#2a1d3d'; ctx.lineWidth = T * 0.06;
      ctx.beginPath(); ctx.moveTo(ex - T * 0.07, ey - T * 0.07); ctx.lineTo(ex + T * 0.07, ey + T * 0.07); ctx.moveTo(ex + T * 0.07, ey - T * 0.07); ctx.lineTo(ex - T * 0.07, ey + T * 0.07); ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, T * 0.12, blink ? T * 0.02 : T * 0.14, 0, 0, 7); ctx.fill();
    if (!blink) { ctx.fillStyle = '#1d1430'; ctx.beginPath(); ctx.arc(ex + fx * T * 0.04, ey + fy * T * 0.04, T * 0.065, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + fx * T * 0.04 - T * 0.025, ey + fy * T * 0.04 - T * 0.03, T * 0.022, 0, 7); ctx.fill(); }
  }
  // smile / tongue
  if (!dead) {
    const mx = hx + fx * T * 0.3 + (fy === 0 ? 0 : 0), my = hy + fy * T * 0.3 + (fy === 0 ? T * 0.1 : 0);
    ctx.fillStyle = 'rgba(255,140,170,.6)';
    ctx.beginPath(); ctx.arc(hx + (fy === 0 ? fx * T * 0.08 : T * 0.27), hy + (fy === 0 ? T * 0.14 : fy * T * 0.12), T * 0.06, 0, 7); ctx.fill();
    if (!reduceMotion && Math.sin(t / 700) > 0.85) {
      ctx.strokeStyle = '#e8456b'; ctx.lineWidth = T * 0.045;
      ctx.beginPath(); ctx.moveTo(hx + fx * T * 0.42, hy + fy * T * 0.42 + (fy === 0 ? T * 0.08 : 0)); ctx.lineTo(hx + fx * T * 0.6, hy + fy * T * 0.6 + (fy === 0 ? T * 0.08 : 0)); ctx.stroke();
    }
  }
}

function drawHint(t) {
  if (!hintFx || anim || over) return;
  const k = (t - hintFx.t0) / 2400; if (k > 1) { hintFx = null; return; }
  const h = cur.snake[0]; const [dx, dy] = DIRS[hintFx.dir];
  const cx = ox + (h[0] + 0.5 + dx) * T, cy = oy + (h[1] + 0.5 + dy) * T;
  const a = 0.5 + 0.5 * Math.sin(t / 120);
  ctx.save(); ctx.globalAlpha = 0.5 + a * 0.4; ctx.translate(cx, cy); ctx.rotate(Math.atan2(dy, dx));
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2a1d3d'; ctx.lineWidth = T * 0.06;
  ctx.beginPath(); ctx.moveTo(T * 0.3, 0); ctx.lineTo(-T * 0.12, -T * 0.26); ctx.lineTo(-T * 0.12, -T * 0.1); ctx.lineTo(-T * 0.32, -T * 0.1); ctx.lineTo(-T * 0.32, T * 0.1); ctx.lineTo(-T * 0.12, T * 0.1); ctx.lineTo(-T * 0.12, T * 0.26); ctx.closePath();
  ctx.stroke(); ctx.fill(); ctx.restore();
}

function burst(gx, gy, colors, n, spd = 1) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.02 + Math.random() * 0.05) * spd;
    particles.push({ x: gx, y: gy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.03 * spd, life: 1, c: colors[i % colors.length], s: 0.05 + Math.random() * 0.07 });
  }
}
function winFx() {
  const e = L.exit; for (let i = 0; i < 3; i++) setTimeout(() => burst(e[0] + .5, e[1] + .5, ['#ff9ec0', '#ffc2d6', '#ffcf4a', '#7fd16e', '#ffffff'], 26, 1.6), i * 150);
}
function drawParticles(dt) {
  for (const p of particles) { p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += 0.002 * dt / 16; p.life -= 0.022 * dt / 16; }
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(ox + p.x * T, oy + p.y * T, p.s * T * (0.5 + p.life * 0.5), 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
}

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(50, t - lastT); lastT = t;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (bg) ctx.drawImage(bg, 0, 0, W, H); else { ctx.fillStyle = '#6ec3dd'; ctx.fillRect(0, 0, W, H); }
  if (L) {
    drawClouds(t);
    drawTerrain();
    drawSpikes(t);
    drawExit(t);
    const showMask = anim && anim.phase === 'move' && (t - anim.t0) < 70 ? anim.oldMask : cur.mask;
    L.fruits.forEach((f, i) => { if ((showMask >> i) & 1) drawFruit(f[0], f[1], t, i); });
    drawSnake(t);
    drawHint(t);
    drawParticles(dt);
  }
  requestAnimationFrame(frame);
}

// ---------- boot ----------
function start(data) {
  data = data || {};
  let first = true;
  try { first = !localStorage.getItem(STORE + '-seen'); localStorage.setItem(STORE + '-seen', '1'); } catch (e) {}
  if (data.li != null) loadLevel(data.li, { cur: data.cur, history: data.history });
  else loadLevel(progress.last ?? 0);
  if (first && data.li == null) showRules(true);
  requestAnimationFrame(frame);
}
const _origLoad = loadLevel;
loadLevel = function (i, restore) { _origLoad(i, restore); progress.last = li; saveProgress(); };
window.claude?.hot?.snapshot?.(() => ({ li, cur, history }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
