<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kral Oyun Arcade</title>
<meta name="description" content="15 free browser games: solo puzzles, 2-player couch battles and online arenas for up to 10 friends. 15 ücretsiz tarayıcı oyunu.">
<meta name="theme-color" content="#0f0c1d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kral Oyun Arcade">
<meta property="og:title" content="Kral Oyun Arcade · 15 free browser games">
<meta property="og:description" content="Puzzles, couch battles and online arenas for up to 10 friends. No downloads, no logins.">
<meta property="og:url" content="https://dorukhiroba.github.io/games/">
<meta property="og:image" content="https://dorukhiroba.github.io/games/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c1d;
    --bg-2: #171329;
    --card: #1d1833;
    --card-2: #262043;
    --line: #2f2850;
    --text: #f6f3ff;
    --muted: #a49dc4;
    --solo: #3fd0b6;
    --duo: #ffb43d;
    --online: #ff5d8f;
    --gold: #ffd25c;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Figtree, system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    padding: max(48px, env(safe-area-inset-top)) 16px 36px;
    text-align: center;
    overflow: hidden;
    isolation: isolate;
  }
  .hero::before {
    content: "";
    position: absolute; inset: -40% -10% auto;
    height: 160%;
    background:
      radial-gradient(40% 50% at 20% 40%, color-mix(in srgb, var(--solo) 28%, transparent), transparent 70%),
      radial-gradient(35% 45% at 50% 20%, color-mix(in srgb, var(--duo) 26%, transparent), transparent 70%),
      radial-gradient(40% 50% at 80% 40%, color-mix(in srgb, var(--online) 28%, transparent), transparent 70%);
    filter: blur(10px);
    z-index: -1;
    animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate3d(-3%, 0, 0) scale(1); }
    50%  { transform: translate3d(2%, -3%, 0) scale(1.08); }
    100% { transform: translate3d(4%, 2%, 0) scale(1.02); }
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(#ffffff14 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: linear-gradient(#000, transparent 85%);
    z-index: -1;
  }
  .crown { width: 64px; height: 48px; display: block; margin: 0 auto 6px; filter: drop-shadow(0 6px 14px #ffd25c55); animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
  h1 {
    font-family: "Lilita One", system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 10vw, 5rem);
    line-height: .95;
    margin: 0;
    letter-spacing: .01em;
    text-shadow: 0 4px 0 #00000055;
  }
  h1 span { color: var(--gold); }
  .tagline { color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.2rem); margin: 12px auto 0; max-width: 34ch; font-weight: 600; }

  /* language toggle */
  .lang {
    position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px;
    display: inline-flex; padding: 3px; gap: 2px;
    border-radius: 999px; background: #0f0c1dcc; border: 1px solid var(--line);
  }
  .lang button {
    border: 0; background: none; cursor: pointer;
    padding: 6px 11px; border-radius: 999px;
    font-size: .8rem; font-weight: 800; letter-spacing: .04em; color: var(--muted);
  }
  .lang button[aria-pressed="true"] { background: var(--card-2); color: var(--text); }
  .lang button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* ---------- sticky nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 12px 16px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .pill {
    --c: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    text-decoration: none; cursor: pointer;
    font-weight: 700; font-size: .92rem;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .pill:hover, .pill:focus-visible { border-color: var(--c); background: var(--card-2); transform: translateY(-1px); outline: none; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .pill .n { color: var(--muted); font-weight: 600; }
  .pill.dice { --c: var(--gold); color: var(--gold); }
  .pill.dice svg { width: 17px; height: 17px; }
  .pill.dice:hover svg { animation: roll .5s ease; }
  @keyframes roll { to { transform: rotate(360deg); } }

  main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 40px; }

  /* ---------- spotlight ---------- */
  .spot {
    position: relative; isolation: isolate; overflow: hidden;
    margin-top: 28px;
    border-radius: 26px;
    border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line));
    display: grid; grid-template-columns: 1fr minmax(0, 1.05fr); gap: 28px; align-items: center;
    padding: 30px;
    text-decoration: none;
    box-shadow: 0 30px 60px -30px color-mix(in srgb, var(--c) 55%, transparent);
  }
  .spot-bg { position: absolute; inset: -40px; z-index: -2; background-size: cover; background-position: center; filter: blur(28px) saturate(1.3); opacity: .55; transform: scale(1.1); }
  .spot::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, #0f0c1df2 30%, #0f0c1d99 70%, #0f0c1d55); }
  .spot .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  .spot .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px #ffd25c33; animation: pulse 1.6s infinite; }
  .spot h2 { font-family: "Lilita One", system-ui, sans-serif; font-weight: 400; font-size: clamp(2rem, 5.5vw, 3.4rem); line-height: 1; margin: 10px 0 10px; }
  .spot p { margin: 0 0 14px; color: #d6d0ee; font-size: 1.05rem; line-height: 1.45; max-width: 44ch; }
  .spot .chips { margin: 0 0 20px; padding: 0; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 22px; border-radius: 14px;
    background: var(--gold); color: #1d1405;
    font-weight: 800; font-size: 1.02rem;
    box-shadow: 0 8px 0 #b8862a, 0 14px 24px -6px #0009;
    transition: transform .15s, box-shadow .15s;
  }
  .cta svg { width: 16px; height: 16px; }
  .spot:hover .cta, .spot:focus-visible .cta { transform: translateY(-2px); box-shadow: 0 10px 0 #b8862a, 0 18px 28px -6px #000a; }
  .spot:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .spot-art { position: relative; }
  .spot-art img { width: 100%; height: auto; display: block; border-radius: 16px; box-shadow: 0 24px 50px -18px #000c; transform: rotate(1.5deg); transition: transform .35s; border: 1px solid #ffffff1f; }
  .spot:hover .spot-art img { transform: rotate(0deg) scale(1.02); }

  /* ---------- recently played ---------- */
  .recent { margin-top: 30px; }
  .row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .row-head h2 { font-family: "Lilita One", system-ui, sans-serif; font-weight: 400; font-size: 1.4rem; margin: 0; }
  .link-btn { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: .85rem; cursor: pointer; padding: 4px; }
  .link-btn:hover { color: var(--text); }
  .strip { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; margin: 0; list-style: none; scroll-snap-type: x proximity; }
  .strip li { flex: none; width: 200px; scroll-snap-align: start; }
  .mini { display: block; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--line); text-decoration: none; transition: transform .2s, border-color .2s; }
  .mini:hover, .mini:focus-visible { transform: translateY(-3px); border-color: var(--c); outline: none; }
  .mini img { width: 100%; height: auto; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .mini span { display: block; padding: 9px 12px 11px; font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- search + tags ---------- */
  .finder { margin-top: 34px; display: grid; gap: 12px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; width: 19px; height: 19px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; padding: 14px 44px 14px 46px;
    border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
    font: inherit; font-size: 1rem; font-weight: 600;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px #ffd25c26; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--card-2); color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    font-size: .82rem; font-weight: 700; color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .tag:hover { color: var(--text); border-color: var(--muted); }
  .tag[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1d1405; }
  .tag:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .empty { text-align: center; color: var(--muted); font-weight: 600; padding: 40px 16px; border: 1px dashed var(--line); border-radius: 18px; margin-top: 30px; }

  /* ---------- sections ---------- */
  section.cat { margin-top: 40px; }
  .sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .sec-icon {
    flex: none; width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 18%, var(--card));
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    color: var(--c);
  }
  .sec-icon svg { width: 26px; height: 26px; }
  .sec-head h2 { font-family: "Lilita One", system-ui, sans-serif; font-weight: 400; font-size: clamp(1.5rem, 4.5vw, 2rem); margin: 0; letter-spacing: .01em; }
  .sec-head p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; font-weight: 600; }
  .live { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-family: Figtree, sans-serif; font-size: .72rem; font-weight: 800; letter-spacing: .06em; vertical-align: middle; color: var(--online); background: color-mix(in srgb, var(--online) 16%, transparent); }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--online); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
    list-style: none; margin: 0; padding: 0;
  }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .grid.pair { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }

  /* ---------- cards ---------- */
  .grid li { perspective: 900px; }
  .card {
    --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%;
    position: relative;
    display: flex; flex-direction: column;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    text-decoration: none;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform .25s ease-out, border-color .2s, box-shadow .2s;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(240px circle at var(--mx) var(--my), color-mix(in srgb, var(--c) 22%, transparent), transparent 65%);
    opacity: 0; transition: opacity .25s;
  }
  .card:hover, .card:focus-visible {
    transform: rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px);
    border-color: var(--c);
    box-shadow: 0 18px 40px -14px color-mix(in srgb, var(--c) 70%, transparent), 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent);
    outline: none;
  }
  .card:hover::after, .card:focus-visible::after { opacity: 1; }
  .card.tilting { transition: transform .06s linear, border-color .2s, box-shadow .2s; }
  .thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--bg-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
  .card:hover .thumb img, .card:focus-visible .thumb img { transform: scale(1.06); }
  .play {
    position: absolute; right: 12px; bottom: 12px;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--c); color: #120f22;
    box-shadow: 0 6px 16px #0007;
    opacity: 0; transform: translateY(6px) scale(.9);
    transition: opacity .2s, transform .2s;
  }
  .play svg { width: 18px; height: 18px; margin-left: 3px; }
  .card:hover .play, .card:focus-visible .play { opacity: 1; transform: none; }
  .badge {
    position: absolute; left: 10px; top: 10px;
    padding: 4px 9px; border-radius: 999px;
    font-size: .72rem; font-weight: 800; letter-spacing: .03em;
    background: #0f0c1dcc; color: var(--text);
    backdrop-filter: blur(4px);
  }
  .badge.new { background: var(--gold); color: #1d1405; }
  .dev {
    position: absolute; right: 10px; top: 10px;
    display: inline-flex; gap: 2px; padding: 4px 6px; border-radius: 999px;
    background: #0f0c1dcc; backdrop-filter: blur(4px); color: #e6e1fb;
  }
  .dev svg { width: 16px; height: 16px; display: block; }
  .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .info h3 { margin: 0; font-size: 1.15rem; font-weight: 800; }
  .info p { margin: 0; color: var(--muted); font-size: .93rem; line-height: 1.4; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .chip { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); }
  .chip.hi { color: var(--c); background: color-mix(in srgb, var(--c) 15%, var(--card)); }

  footer { text-align: center; color: var(--muted); font-size: .88rem; padding: 24px 16px max(32px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 20px; }
  footer b { color: var(--text); }

  @media (max-width: 760px) {
    .spot { grid-template-columns: 1fr; padding: 18px; gap: 16px; }
    .spot-art { order: -1; }
    .spot-art img { transform: none; }
    .spot::before { background: linear-gradient(180deg, #0f0c1d66, #0f0c1df2 55%); }
    .spot p { font-size: .95rem; }
  }
  /* phones: two compact columns */
  @media (max-width: 560px) {
    .grid, .grid.wide, .grid.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .info { padding: 10px 11px 12px; gap: 4px; }
    .info h3 { font-size: .98rem; }
    .info p { font-size: .8rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .chip { font-size: .66rem; padding: 2px 7px; }
    .badge { font-size: .64rem; left: 7px; top: 7px; padding: 3px 7px; }
    .dev { right: 7px; top: 7px; padding: 3px 5px; }
    .dev svg { width: 13px; height: 13px; }
    .play { display: none; }
    .sec-icon { width: 42px; height: 42px; }
    .pill { padding: 7px 11px; font-size: .84rem; }
    .tags { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
    .tag { flex: none; }
    .strip li { width: 150px; }
    .hero { padding-top: max(58px, env(safe-area-inset-top)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="lang" role="group" aria-label="Language / Dil">
    <button type="button" data-lang="tr">TR</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <svg class="crown" viewBox="0 0 64 48" aria-hidden="true">
    <path d="M4 14 L18 26 L32 6 L46 26 L60 14 L54 42 H10 Z" fill="#ffd25c" stroke="#b8862a" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="4" cy="14" r="4" fill="#ff5d8f"/><circle cx="32" cy="6" r="4" fill="#3fd0b6"/><circle cx="60" cy="14" r="4" fill="#ffb43d"/>
  </svg>
  <h1>Kral Oyun <span>Arcade</span></h1>
  <p class="tagline" data-t="tagline"></p>
</header>

<nav class="nav" id="nav" aria-label="Game categories"></nav>

<main>
  <a class="spot" id="spot"></a>

  <section class="recent" id="recent" hidden>
    <div class="row-head">
      <h2 data-t="recent"></h2>
      <button type="button" class="link-btn" id="recent-clear" data-t="clear"></button>
    </div>
    <ul class="strip" id="recent-list"></ul>
  </section>

  <div class="finder" role="search">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" autocomplete="off" spellcheck="false">
      <button type="button" class="clear" id="q-clear" hidden>×</button>
    </label>
    <div class="tags" id="tags"></div>
  </div>

  <div id="sections"></div>
  <p class="empty" id="empty" hidden data-t="empty"></p>
</main>

<footer data-t="footer"></footer>

<script>
  /* ================= data ================= */
  // dev: which inputs a game supports. t = touch, k = keyboard, m = mouse/click
  const GAMES = [
    { slug: "kaboom-arena",  cat: "online", name: "Kaboom Arena",  badge: "up10", tags: ["Bomber", "Also local"], dev: "tk",
      desc: { en: "Drop bombs, blast crates and be the last one standing.", tr: "Bomba bırak, kasaları patlat, ayakta kalan son kişi ol." } },
    { slug: "tank-tussle",   cat: "online", name: "Tank Tussle",   badge: "up10", tags: ["Duos", "3D", "Arena"], dev: "tkm",
      desc: { en: "Free-for-all or Duos: team up in pairs, no friendly fire.", tr: "Herkes herkese karşı ya da ikili takımlar. Dost ateşi yok." } },
    { slug: "saltpit-arena", cat: "online", name: "Saltpit Arena", badge: "up10", tags: ["3D", "Shooter"], dev: "tkm",
      desc: { en: "Six weapons, six maps and killstreaks up to a nuke. First to 30 wins.", tr: "Altı silah, altı harita ve nükleere kadar seri ödüller. 30'a ilk ulaşan kazanır." } },

    { slug: "kafa-kafaya", cat: "duo", name: "Kafa Kafaya", badge: "2p", tags: ["Football", "Turkish"], dev: "tk",
      desc: { en: "Neighbourhood league: 1v1 head football. Jump, shoot, score!", tr: "Mahalle ligi: 1'e 1 kafa topu. Zıpla, vur, gol at!" } },
    { slug: "epoch-clash", cat: "duo", name: "Epoch Clash", badge: "2p", tags: ["Strategy", "vs CPU"], dev: "tk",
      desc: { en: "Train troops, hold the lane and evolve through five ages.", tr: "Asker yetiştir, hattı tut ve beş çağ boyunca gelişerek kazan." } },

    { slug: "demir-tac-arena",  cat: "solo", name: "Demir Taç Arena",  badge: "new", tags: ["RPG", "Online 1v1", "Turkish"], dev: "tkm",
      desc: { en: "Create your gladiator, win tournaments and take the crown. Online duels with a friend too.", tr: "Gladyatörünü yarat, turnuvaları kazan, tacı al. Arkadaşınla online düello da var." } },
    { slug: "nugget-rush",      cat: "solo", name: "Nugget Rush",      badge: "new", tags: ["Arcade"], dev: "tkm",
      desc: { en: "Swing the claw. Grab the gold. Beat the clock.", tr: "Kancayı salla, altını kap, süreyi yen." } },
    { slug: "mochi-tower",      cat: "solo", name: "Mochi Tower",      tags: ["Stacking", "3D"], dev: "tkm",
      desc: { en: "Stack the sweets. Keep the mochi on top.", tr: "Tatlıları üst üste diz. Mochi en tepede kalsın." } },
    { slug: "orchard-drop",     cat: "solo", name: "Orchard Drop",     tags: ["Merge", "Physics"], dev: "tkm",
      desc: { en: "Match two of a kind and keep the fruit below the line.", tr: "Aynı meyveleri birleştir, meyveleri çizginin altında tut." } },
    { slug: "loop-blaster",     cat: "solo", name: "Loop Blaster",     tags: ["Puzzle"], dev: "tm",
      desc: { en: "Send blasters around the belt to clear the board.", tr: "Blasterları bant boyunca gönder, tahtayı temizle." } },
    { slug: "gem-mosaic",       cat: "solo", name: "Gem Mosaic",       tags: ["Puzzle"], dev: "tm",
      desc: { en: "Sort the jewels. Restore the picture.", tr: "Mücevherleri sırala, resmi tamamla." } },
    { slug: "city-block-smash", cat: "solo", name: "City Block Smash", tags: ["Arcade", "3D"], dev: "tkm",
      desc: { en: "Smash your way down a giant brick tower.", tr: "Dev tuğla kuleyi yıka yıka aşağı in." } },
    { slug: "aradaki-7-fark",   cat: "solo", name: "Aradaki 7 Fark",   tags: ["Puzzle", "Turkish"], dev: "tm",
      desc: { en: "Spot the 7 differences between two pictures.", tr: "İki resim arasındaki 7 farkı bul." } },
    { slug: "word-calm",        cat: "solo", name: "Word Calm",        tags: ["Word"], dev: "tm",
      desc: { en: "Swipe letters. Fill the valley.", tr: "Harfleri kaydır, vadiyi doldur." } },
    { slug: "wordfield",        cat: "solo", name: "Wordfield",        tags: ["Word"], dev: "tm",
      desc: { en: "Find hidden words across, down and diagonally.", tr: "Gizli kelimeleri yatay, dikey ve çapraz bul." } },
  ];
  const FEATURED = "demir-tac-arena";

  const CATS = [
    { id: "online", color: "var(--online)", live: true },
    { id: "duo",    color: "var(--duo)" },
    { id: "solo",   color: "var(--solo)" },
  ];

  const T = {
    en: {
      tagline: "Free browser games. No downloads, no logins. Pick one and play.",
      cat_online: "Online · 10 players", short_online: "Online",
      blurb_online: "Send your friends the link, join the same room and battle. Bots fill empty spots.",
      cat_duo: "2 players · same device", short_duo: "2 Players",
      blurb_duo: "Share one keyboard or tablet and go head to head. Each one also has a computer opponent.",
      cat_solo: "1 player", short_solo: "1 Player",
      blurb_solo: "Puzzles, word games and quick arcade fun to play on your own.",
      live: "LIVE", new: "New", up10: "Up to 10", "2p": "2P",
      spot_eyebrow: "New game", play_now: "Play now",
      recent: "Continue playing", clear: "Clear",
      search: "Search games…", all: "All", surprise: "Surprise me",
      empty: "No games match. Try another word or tag.",
      dev_t: "Works with touch", dev_k: "Keyboard controls", dev_m: "Mouse or click",
      footer: "<b>15 games</b> · works on phone and desktop · online games connect you straight to your friends",
      cats: "Game categories",
    },
    tr: {
      tagline: "Ücretsiz tarayıcı oyunları. İndirme yok, giriş yok. Birini seç ve oyna.",
      cat_online: "Online · 10 oyuncu", short_online: "Online",
      blurb_online: "Arkadaşlarına linki gönder, aynı odaya girin ve kapışın. Boş yerleri botlar doldurur.",
      cat_duo: "2 oyuncu · aynı cihaz", short_duo: "2 Oyunculu",
      blurb_duo: "Tek klavye ya da tablette karşı karşıya gelin. Hepsinde bilgisayara karşı oynama seçeneği de var.",
      cat_solo: "Tek oyunculu", short_solo: "Tek Oyunculu",
      blurb_solo: "Tek başına oynamak için bulmacalar, kelime oyunları ve hızlı arcade eğlencesi.",
      live: "CANLI", new: "Yeni", up10: "10 kişi", "2p": "2 Oyuncu",
      spot_eyebrow: "Yeni oyun", play_now: "Hemen oyna",
      recent: "Kaldığın yerden devam et", clear: "Temizle",
      search: "Oyun ara…", all: "Tümü", surprise: "Rastgele oyun",
      empty: "Eşleşen oyun yok. Başka bir kelime ya da etiket dene.",
      dev_t: "Dokunmatikle oynanır", dev_k: "Klavyeyle oynanır", dev_m: "Fare ya da tıklamayla oynanır",
      footer: "<b>15 oyun</b> · telefonda ve bilgisayarda çalışır · online oyunlar seni doğrudan arkadaşlarına bağlar",
      cats: "Oyun kategorileri",
    },
  };
  const TAGS_TR = {
    "Bomber": "Bombacı", "Also local": "Yerel de var", "Duos": "İkili", "3D": "3D", "Arena": "Arena", "Shooter": "Nişancı",
    "Football": "Futbol", "Turkish": "Türkçe", "Strategy": "Strateji", "vs CPU": "Bilgisayara karşı", "RPG": "RPG",
    "Online 1v1": "Online 1v1", "Arcade": "Arcade", "Stacking": "Dizme", "Merge": "Birleştirme", "Physics": "Fizik",
    "Puzzle": "Bulmaca", "Word": "Kelime",
  };
  // Tags shown as filters, most useful first.
  const FILTER_TAGS = ["Puzzle", "Word", "Arcade", "3D", "Arena", "Shooter", "Strategy", "RPG", "Physics", "Turkish"];

  const ICON = {
    online: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg>',
    duo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.4"/><circle cx="17" cy="9" r="2.8"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><path d="M15 14.3c3.3-.6 7 1.4 7 5.7"/></svg>',
    solo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><g fill="currentColor" stroke="none"><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></g></svg>',
    t: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
    k: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
    m: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></svg>',
  };

  /* ================= state ================= */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const bySlug = Object.fromEntries(GAMES.map(g => [g.slug, g]));
  const catOf = id => CATS.find(c => c.id === id);
  let lang = store.get("kral-lang", (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en");
  let query = "";
  let activeTag = null;

  const $ = s => document.querySelector(s);
  const t = k => T[lang][k] ?? k;
  const tagName = tag => lang === "tr" ? (TAGS_TR[tag] || tag) : tag;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function remember(slug) {
    const list = store.get("kral-recent", []).filter(s => s !== slug);
    list.unshift(slug);
    store.set("kral-recent", list.slice(0, 8));
  }

  /* ================= rendering ================= */
  function devIcons(g) {
    return `<span class="dev">${[...g.dev].map(d => `<span title="${esc(t("dev_" + d))}" aria-label="${esc(t("dev_" + d))}" role="img">${ICON[d]}</span>`).join("")}</span>`;
  }

  function card(g, eager) {
    const c = catOf(g.cat);
    const badge = g.badge ? `<span class="badge${g.badge === "new" ? " new" : ""}">${esc(t(g.badge))}</span>` : "";
    return `
      <li data-slug="${g.slug}">
        <a class="card" href="${g.slug}/" style="--c:${c.color}" data-slug="${g.slug}">
          <div class="thumb">
            <img src="thumbs/${g.slug}.jpg" alt="" width="640" height="400" loading="${eager ? "eager" : "lazy"}" decoding="async">
            ${badge}${devIcons(g)}
            <span class="play" aria-hidden="true">${ICON.play}</span>
          </div>
          <div class="info">
            <h3>${esc(g.name)}</h3>
            <p>${esc(g.desc[lang])}</p>
            <div class="chips">${g.tags.map((tag, i) => `<span class="chip${g.cat !== "solo" && i === 0 ? " hi" : ""}">${esc(tagName(tag))}</span>`).join("")}</div>
          </div>
        </a>
      </li>`;
  }

  function renderStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(el => {
      const k = el.dataset.t;
      if (k === "footer") el.innerHTML = t(k); else el.textContent = t(k);
    });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("#q").placeholder = t("search");
    $("#q").setAttribute("aria-label", t("search"));
    $("#nav").setAttribute("aria-label", t("cats"));
  }

  function renderNav() {
    $("#nav").innerHTML = CATS.map(c =>
      `<a class="pill" href="#${c.id}" style="--c:${c.color}"><span class="dot"></span>${esc(t("short_" + c.id))}<span class="n">${GAMES.filter(g => g.cat === c.id).length}</span></a>`
    ).join("") + `<button type="button" class="pill dice" id="dice">${ICON.dice}${esc(t("surprise"))}</button>`;
    $("#dice").onclick = () => {
      const pool = GAMES.filter(matches);
      const g = (pool.length ? pool : GAMES)[Math.floor(Math.random() * (pool.length || GAMES.length))];
      remember(g.slug);
      location.href = g.slug + "/";
    };
  }

  function renderSpot() {
    const g = bySlug[FEATURED], c = catOf(g.cat);
    const el = $("#spot");
    el.href = g.slug + "/";
    el.dataset.slug = g.slug;
    el.style.setProperty("--c", c.color);
    el.innerHTML = `
      <div class="spot-bg" style="background-image:url('thumbs/${g.slug}.jpg')"></div>
      <div>
        <span class="eyebrow">${esc(t("spot_eyebrow"))}</span>
        <h2>${esc(g.name)}</h2>
        <p>${esc(g.desc[lang])}</p>
        <div class="chips">${g.tags.map(tag => `<span class="chip">${esc(tagName(tag))}</span>`).join("")}</div>
        <span class="cta">${ICON.play}${esc(t("play_now"))}</span>
      </div>
      <div class="spot-art"><img src="thumbs/${g.slug}.jpg" alt="" width="640" height="400"></div>`;
  }

  function renderRecent() {
    const list = store.get("kral-recent", []).filter(s => bySlug[s]).slice(0, 6);
    $("#recent").hidden = list.length === 0;
    $("#recent-list").innerHTML = list.map(s => {
      const g = bySlug[s];
      return `<li><a class="mini" href="${s}/" data-slug="${s}" style="--c:${catOf(g.cat).color}"><img src="thumbs/${s}.jpg" alt="" width="640" height="400" loading="lazy"><span>${esc(g.name)}</span></a></li>`;
    }).join("");
  }

  function renderTags() {
    $("#tags").innerHTML =
      `<button type="button" class="tag" data-tag="" aria-pressed="${activeTag === null}">${esc(t("all"))}</button>` +
      FILTER_TAGS.map(tag => `<button type="button" class="tag" data-tag="${esc(tag)}" aria-pressed="${activeTag === tag}">${esc(tagName(tag))}</button>`).join("");
  }

  function renderSections() {
    $("#sections").innerHTML = CATS.map((c, ci) => {
      const games = GAMES.filter(g => g.cat === c.id);
      const cls = games.length === 2 ? " pair" : games.length === 3 ? " wide" : "";
      return `
        <section class="cat" id="${c.id}" aria-labelledby="h-${c.id}">
          <div class="sec-head" style="--c:${c.color}">
            <div class="sec-icon">${ICON[c.id]}</div>
            <div>
              <h2 id="h-${c.id}">${esc(t("cat_" + c.id))}${c.live ? `<span class="live">${esc(t("live"))}</span>` : ""}</h2>
              <p>${esc(t("blurb_" + c.id))}</p>
            </div>
          </div>
          <ul class="grid${cls}">${games.map(g => card(g, ci === 0)).join("")}</ul>
        </section>`;
    }).join("");
    applyFilter();
  }

  /* ================= search + filter ================= */
  const fold = s => s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i");
  function matches(g) {
    if (activeTag && !g.tags.includes(activeTag)) return false;
    if (!query) return true;
    const hay = fold([g.name, g.desc.en, g.desc.tr, ...g.tags, ...g.tags.map(x => TAGS_TR[x] || x)].join(" "));
    return fold(query).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
  }
  function applyFilter() {
    let shown = 0;
    document.querySelectorAll("section.cat").forEach(sec => {
      let n = 0;
      sec.querySelectorAll("li[data-slug]").forEach(li => {
        const ok = matches(bySlug[li.dataset.slug]);
        li.hidden = !ok;
        if (ok) n++;
      });
      sec.hidden = n === 0;
      shown += n;
    });
    $("#empty").hidden = shown > 0;
    $("#q-clear").hidden = !query;
    const filtering = !!(query || activeTag);
    $("#spot").hidden = filtering;
    if (filtering) $("#recent").hidden = true; else renderRecent();
  }

  $("#q").addEventListener("input", e => { query = e.target.value.trim(); applyFilter(); });
  $("#q-clear").addEventListener("click", () => { $("#q").value = ""; query = ""; applyFilter(); $("#q").focus(); });
  $("#tags").addEventListener("click", e => {
    const b = e.target.closest(".tag"); if (!b) return;
    activeTag = b.dataset.tag || null;
    if (activeTag === b.dataset.tag && b.getAttribute("aria-pressed") === "true" && activeTag) activeTag = null;
    renderTags(); applyFilter();
  });
  $("#recent-clear").addEventListener("click", () => { store.set("kral-recent", []); renderRecent(); });

  // Remember games opened from here (games also record themselves via quit.js).
  document.addEventListener("click", e => { const a = e.target.closest("a[data-slug]"); if (a) remember(a.dataset.slug); });

  /* ================= language ================= */
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    if (lang === b.dataset.lang) return;
    lang = b.dataset.lang; store.set("kral-lang", lang); renderAll();
  }));

  /* ================= card tilt (mouse only) ================= */
  const canTilt = matchMedia("(hover: hover) and (pointer: fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (canTilt) {
    document.addEventListener("pointermove", e => {
      const c = e.target.closest && e.target.closest(".card");
      if (!c) return;
      const r = c.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      c.classList.add("tilting");
      c.style.setProperty("--ry", ((x - .5) * 9).toFixed(2) + "deg");
      c.style.setProperty("--rx", ((.5 - y) * 7).toFixed(2) + "deg");
      c.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
      c.style.setProperty("--my", (y * 100).toFixed(1) + "%");
    });
    document.addEventListener("pointerout", e => {
      const c = e.target.closest && e.target.closest(".card");
      if (!c || c.contains(e.relatedTarget)) return;
      c.classList.remove("tilting");
      c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg");
    });
  }

  function renderAll() { renderStatic(); renderNav(); renderSpot(); renderTags(); renderSections(); }
  renderAll();

  // Coming back with the browser's Back button: refresh the recent row.
  addEventListener("pageshow", e => { if (e.persisted) applyFilter(); });

  // Sections are built after load, so jump to a #category link ourselves.
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
