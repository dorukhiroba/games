<style>
/* Layout: full-bleed floating-island diorama; frosted chips pinned to the top corners; tool dock + hint pill bottom-centre. */
:root{
  --sky-top:#8fcbee; --sky-bottom:#fbe3c9;
  --paper:rgba(247,251,245,.84); --rim:rgba(255,255,255,.75);
  --ink:#2b3830; --ink-soft:#5e6d62;
  --honey:#efb03f; --honey-soft:rgba(239,176,63,.24); --hover:rgba(43,56,48,.07);
  --shadow:0 8px 24px rgba(36,58,48,.16), 0 1px 2px rgba(36,58,48,.08);
  --font-display:'Gluten','Trebuchet MS',cursive;
  --font-ui:'Nunito Sans',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky-bottom);color:var(--ink);font-family:var(--font-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#sky{position:fixed;inset:0;background:linear-gradient(to bottom,var(--sky-top),var(--sky-bottom))}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.card{pointer-events:auto;background:var(--paper);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);border:1px solid var(--rim);border-radius:20px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 11px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.3px;color:var(--ink)}
.brand p{margin:3px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.controls{display:flex;align-items:center;gap:4px;padding:5px;flex-wrap:wrap}
.sun{display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.sun svg{width:18px;height:18px;flex:none;color:var(--honey)}
#timeLabel{min-width:78px}
#time{width:118px;accent-color:var(--honey);cursor:pointer}
.chip{border:0;background:transparent;border-radius:14px;height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font:800 12.5px var(--font-ui);color:var(--ink);cursor:pointer}
.chip:hover{background:var(--hover)}
.chip svg{width:18px;height:18px}
.chip[aria-pressed="false"] svg .wave{display:none}
.chip[aria-pressed="true"] svg .mute{display:none}
.bottom{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.hint{background:var(--paper);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--rim);border-radius:16px;padding:7px 14px;box-shadow:var(--shadow);text-align:center;max-width:min(560px,100%);font-size:13.5px;font-weight:700;line-height:1.35;text-wrap:balance}
.hint small{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.2px}
.dock{display:flex;gap:2px;padding:6px;max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:24px}
.dock::-webkit-scrollbar{display:none}
.tool{flex:none;width:62px;border:0;background:transparent;border-radius:18px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font:800 11px var(--font-ui);letter-spacing:.2px;cursor:pointer;position:relative;transition:transform .15s ease,background .15s}
.tool svg{width:30px;height:30px}
.tool:hover{background:var(--hover)}
.tool:active{transform:scale(.94)}
.tool[aria-pressed="true"]{background:var(--honey-soft);box-shadow:inset 0 0 0 2px var(--honey)}
.tool kbd{position:absolute;top:4px;right:7px;font:800 9px var(--font-ui);color:var(--ink-soft);opacity:.55}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(30,40,60,.18) 100%)}
.variants{display:flex;gap:2px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:16px}
.variants::-webkit-scrollbar{display:none}
.variants .chip{flex:none;height:32px;padding:0 12px}
.variants .chip[aria-pressed="true"]{background:var(--honey-soft);box-shadow:inset 0 0 0 2px var(--honey)}
#toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);pointer-events:none;background:var(--ink);color:#f7fbf5;font-weight:800;font-size:13px;padding:8px 14px;border-radius:12px;box-shadow:var(--shadow);white-space:nowrap}
@media (max-width:620px){
  .brand h1{font-size:22px}
  .brand svg{width:28px;height:28px}
  #timeLabel,.chip .lbl{display:none}
  #time{width:92px}
  .tool{width:52px}
  .tool svg{width:26px;height:26px}
  .tool kbd{display:none}
  #toast{top:calc(124px + env(safe-area-inset-top,0px))}
}
@media (pointer:coarse){ .tool kbd{display:none} }
@media (prefers-reduced-motion:reduce){ .tool{transition:none} }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#world');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

/* ---------- helpers ---------- */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rint = n => Math.floor(Math.random()*n);
const newSeed = () => (Math.random()*1e9)|0;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const easeOutBack = p => { const c1=1.9, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
const rep = (k,v) => (k && k[0]==='_') ? undefined : v;

const R = 11, GRID = 1.25, S = 1024, FH = 0.62, HW = 0.98, BASE = 0.12;
const PATH_R = 0.5, ERASE_R = 0.6;
const WALLS = ['#f7f2e8','#f3e2cf','#e4eedb','#f4e8c6','#e2ecef','#f2dcd6'];
const ROOFS = ['#d8664c','#5579a3','#6c9a58','#e2a236','#9e5d7c','#4f8f8a'];
const LEAVES = ['#6aa84f','#7dbb5a','#5c9a4a','#8fc463','#e3a03e','#d97a4a'];
const PINES = ['#4f8a5b','#5d9a64','#45805a'];
const PETALS = ['#ffffff','#f7c1d6','#f6d95a','#b8a4f0','#f2998b','#9fd0f2'];
const STONES = ['#cdc4b5','#bfb5a6','#d9d1c3','#b3a998','#c7bba9','#d3c9b8'];
const PEB = ['#e9d6b2','#cfae80','#efe2c6','#c4a173','#dcc49c'];
const SHUTTERS = ['#5579a3','#6c9a58','#9e5d7c','#4f8f8a','#c9773e','#8a6a52'];
const CASTLE = ['#b9b4ab','#a9a49b','#c5c0b7','#9f9b93','#b3ada3'];
const HEDGE = ['#5f9a4a','#6aa84f','#58904a','#72b058'];
const WATER_R = .6, DIRT_R = .55;
const WALL_KINDS = [{id:'stone',label:'Stone wall'},{id:'castle',label:'Castle wall'},{id:'fence',label:'Wooden fence'},{id:'picket',label:'Picket fence'},{id:'hedge',label:'Hedge'}];

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);

const hemi = new THREE.HemisphereLight(0xe8f5ff, 0x7d9e58, 0.65);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, {left:-14,right:14,top:14,bottom:-14,near:1,far:80});
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const matCache = {};
function M(hex){ return matCache[hex] || (matCache[hex] = new THREE.MeshStandardMaterial({color:hex, roughness:.92, metalness:0, flatShading:true})); }
const instMat = new THREE.MeshStandardMaterial({color:'#ffffff', roughness:.95, metalness:0, flatShading:true});
const windowMat = new THREE.MeshStandardMaterial({color:'#4c5a6a', emissive:'#ffc25c', emissiveIntensity:0, roughness:.5, flatShading:true});
const lampMat = new THREE.MeshStandardMaterial({color:'#fff3cf', emissive:'#ffcf6e', emissiveIntensity:.2, roughness:.6, flatShading:true});
const cloudMat = new THREE.MeshStandardMaterial({color:'#ffffff', emissive:'#ffffff', emissiveIntensity:.3, roughness:1, flatShading:true});

function glowTexture(){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); const g=x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.25,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
const glowTex = glowTexture();
const glowMat = new THREE.SpriteMaterial({map:glowTex, color:'#ffcf7a', transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});
const poolMat = new THREE.MeshBasicMaterial({map:glowTex, color:'#ffc870', transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});

const G = {
  box: new THREE.BoxGeometry(1,1,1),
  ico0: new THREE.IcosahedronGeometry(1,0),
  ico1: new THREE.IcosahedronGeometry(1,1),
  cyl: new THREE.CylinderGeometry(1,1,1,7),
  cone: new THREE.ConeGeometry(1,1,7),
  cone4: new THREE.ConeGeometry(1,1,4).rotateY(Math.PI/4),
  stone: new THREE.DodecahedronGeometry(0.62,0),
  disc: new THREE.PlaneGeometry(1,1),
};
function part(parent, geo, mat, x,y,z, sx,sy,sz){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m; }

/* ---------- ground (painted canvas) ---------- */
function mkCanvas(){ const c=document.createElement('canvas'); c.width=c.height=S; return c; }
const grassC=mkCanvas(), pathC=mkCanvas(), pebC=mkCanvas(), groundC=mkCanvas();
const dirtC=mkCanvas(), waterC=mkCanvas(), tintC=mkCanvas(), waterBlurC=mkCanvas();
const gCtx=grassC.getContext('2d'), pCtx=pathC.getContext('2d'), bCtx=pebC.getContext('2d'), cCtx=groundC.getContext('2d');
const dCtx=dirtC.getContext('2d'), wCtx=waterC.getContext('2d',{willReadFrequently:true}), tCtx=tintC.getContext('2d'), wbCtx=waterBlurC.getContext('2d');
const PAINT={path:[pathC,pCtx], peb:[pebC,bCtx], dirt:[dirtC,dCtx], water:[waterC,wCtx]};
(function paintGrass(){
  const r=mulberry(7);
  gCtx.fillStyle='#93c76a'; gCtx.fillRect(0,0,S,S);
  const tones=['#87bd5f','#9fd176','#8cc263','#a9d880','#80b75a','#97cb6c'];
  for(let i=0;i<2800;i++){ gCtx.globalAlpha=.22+r()*.35; gCtx.fillStyle=tones[(r()*tones.length)|0]; const rr=5+r()*26; gCtx.beginPath(); gCtx.ellipse(r()*S,r()*S,rr,rr*(.55+r()*.45),r()*3,0,6.283); gCtx.fill(); }
  for(let i=0;i<6000;i++){ gCtx.globalAlpha=.4; gCtx.fillStyle=r()<.5?'#71a94f':'#b8df8f'; gCtx.fillRect(r()*S,r()*S,1.6,3+r()*3); }
  gCtx.globalAlpha=1;
})();
const groundTex = new THREE.CanvasTexture(groundC);
groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 4;
let groundDirty = true;
function w2c(x,z){ return [(x/R+1)/2*S, (z/R+1)/2*S]; }
function stamp(x,z){
  const [px,py]=w2c(x,z), rr=PATH_R/(2*R)*S;
  pCtx.fillStyle='#d4b68a'; pCtx.beginPath(); pCtx.arc(px,py,rr,0,6.283); pCtx.fill();
  if(Math.random()<.75){ const a=Math.random()*6.283, d=Math.random()*rr*.7, pr=rr*(.16+Math.random()*.14);
    bCtx.fillStyle=PEB[rint(PEB.length)]; bCtx.beginPath(); bCtx.ellipse(px+Math.cos(a)*d, py+Math.sin(a)*d, pr, pr*.72, Math.random()*3, 0, 6.283); bCtx.fill(); }
  groundDirty=true;
}
function strokeWith(fn,a,b,step){ const d=Math.hypot(b.x-a.x,b.z-a.z), n=Math.max(1,Math.ceil(d/step)); for(let i=1;i<=n;i++){ const t=i/n; fn(lerp(a.x,b.x,t), lerp(a.z,b.z,t)); } }
function strokePath(a,b){ strokeWith(stamp,a,b,.12); }
// tilled soil: brown earth with darker clods and a few light grains
function stampDirt(x,z){
  const [px,py]=w2c(x,z), rr=DIRT_R/(2*R)*S;
  dCtx.fillStyle='#9b7653'; dCtx.beginPath(); dCtx.arc(px,py,rr,0,6.283); dCtx.fill();
  for(let i=0;i<4;i++){ const a=Math.random()*6.283, d=Math.random()*rr*.8, pr=rr*(.07+Math.random()*.1);
    dCtx.fillStyle=Math.random()<.65?'#7c5a3d':'#b48d63'; dCtx.beginPath(); dCtx.ellipse(px+Math.cos(a)*d, py+Math.sin(a)*d, pr, pr*.7, Math.random()*3, 0, 6.283); dCtx.fill(); }
  groundDirty=true;
}
// water mask (white); trees, flowers and lanterns in the way are washed out
function stampWater(x,z){
  if(inHouse(x,z,.12)) return false;
  const [px,py]=w2c(x,z), rr=WATER_R/(2*R)*S;
  wCtx.fillStyle='#fff'; wCtx.beginPath(); wCtx.arc(px,py,rr,0,6.283); wCtx.fill();
  for(const it of items.slice()) if((it.t==='tree'||it.t==='fl'||it.t==='lamp') && Math.hypot(it.x-x,it.z-z)<WATER_R*.85) removeItem(it);

function paintAlpha(ctx,x,z){ const [px,py]=w2c(x,z); return ctx.getImageData(clamp(px|0,0,S-1),clamp(py|0,0,S-1),1,1).data[3]; }

const nearWater=(x,z,d)=>isWater(x,z)||isWater(x+d,z)||isWater(x-d,z)||isWater(x,z+d)||isWater(x,z-d);
function erasePaint(x,z,rad){ const [px,py]=w2c(x,z), rr=rad/(2*R)*S; for(const c of [pCtx,bCtx,dCtx,wCtx]){ c.save(); c.globalCompositeOperation='destination-out'; c.beginPath(); c.arc(px,py,rr,0,6.283); c.fill(); c.restore(); } groundDirty=true; }
let lastComposite=0;
function composite(){
  cCtx.drawImage(grassC,0,0);
  cCtx.save(); cCtx.shadowColor='rgba(70,48,24,.35)'; cCtx.shadowBlur=5; cCtx.filter='blur(1.2px)'; cCtx.drawImage(dirtC,0,0); cCtx.restore();
  // sandy banks around water
  tCtx.clearRect(0,0,S,S); tCtx.drawImage(waterC,0,0); tCtx.globalCompositeOperation='source-in'; tCtx.fillStyle='#d9c690'; tCtx.fillRect(0,0,S,S); tCtx.globalCompositeOperation='source-over';
  cCtx.save(); cCtx.filter='blur(6px)'; cCtx.drawImage(tintC,0,0); cCtx.drawImage(tintC,0,0); cCtx.restore();
  cCtx.save(); cCtx.shadowColor='rgba(96,74,40,.38)'; cCtx.shadowBlur=7; cCtx.filter='blur(1.4px)'; cCtx.drawImage(pathC,0,0); cCtx.restore();
  cCtx.save(); cCtx.filter='blur(.5px)'; cCtx.drawImage(pebC,0,0); cCtx.restore();
  // soft-edged mask for the water surface: the blur doubles as depth
  wbCtx.clearRect(0,0,S,S); wbCtx.save(); wbCtx.filter='blur(7px)'; wbCtx.drawImage(waterC,0,0); wbCtx.restore();
  waterTex.needsUpdate=true; groundTex.needsUpdate=true; groundDirty=false; lastComposite=performance.now(); clutterDirty=true;
}

/* ---------- island ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(R,96), new THREE.MeshStandardMaterial({map:groundTex, roughness:1, metalness:0}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const lip = new THREE.Mesh(new THREE.CylinderGeometry(R, R*.985, .4, 96, 1, true), M('#77ad54'));
lip.position.y=-.2; lip.receiveShadow=true; scene.add(lip);

/* water surface: an unlit shader over the painted mask, with depth, foam and glints */
const waterTex = new THREE.CanvasTexture(waterBlurC);
const waterMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ mask:{value:waterTex}, time:{value:0}, night:{value:0} },
  vertexShader:'varying vec2 vUv; varying vec3 vW; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
  fragmentShader:[

/* walls: smoothed polyline → courses of instanced stones */
function chaikin(pts){ let p=pts; for(let k=0;k<2;k++){ if(p.length<3) return p; const q=[p[0]]; for(let i=0;i<p.length-1;i++){ const a=p[i],b=p[i+1]; q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]); } q.push(p[p.length-1]); p=q; } return p; }
function polyInfo(p){ const cum=[0]; for(let i=1;i<p.length;i++) cum.push(cum[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1])); return {p,cum,total:cum[cum.length-1]}; }
function pointAt(info,s){ const {p,cum}=info; if(p.length===1) return [p[0][0],p[0][1],1,0]; let i=1; while(i<cum.length-1 && cum[i]<s) i++;
  const seg=cum[i]-cum[i-1]||1e-6, t=clamp((s-cum[i-1])/seg,0,1), a=p[i-1], b=p[i]; return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), (b[0]-a[0])/seg, (b[1]-a[1])/seg]; }

    for(let s=off; s<=info.total+.001 || k===0; s+=step, k++){
      const r=mulberry(it.seed + c*7919 + k*104729); const q=pointAt(info,Math.min(s,info.total)); const top=c===courses-1;
      out.push({key:c*100000+k, x:q[0]+(r()-.5)*.03, y:.1+c*.19+(r()-.5)*.02, z:q[1]+(r()-.5)*.03, yaw:Math.atan2(-q[3],q[2])+(r()-.5)*.28,
        sx:.32*(.85+r()*.3), sy:top?.16:.2*(.9+r()*.2), sz:top?.34:.27*(.9+r()*.2), col: top&&r()<.32 ? '#98ad74' : STONES[(r()*STONES.length)|0]});

// Every wall style is a list of instanced pieces along the smoothed line.
// key must stay stable as the line grows, so pieces pop in only once.
function wallPieces(it){
  const kind=it.kind||'stone';
  if(kind==='stone') return wallStones(it).map(s=>({...s,geo:'stone'}));
  const info=polyInfo(chaikin(it.pts)), tot=info.total, out=[];
  const yawOf=q=>Math.atan2(-q[3],q[2]);
  const along=(step,off,fn)=>{ let k=0; for(let s=off; s<=tot+.001 || k===0; s+=step, k++){ fn(pointAt(info,Math.min(s,tot)),k); if(tot<.05) break; } };
  const P=(geo,key,q,y,sx,sy,sz,col,yaw)=>out.push({geo,key,x:q[0],y,z:q[1],yaw:yaw??yawOf(q),sx,sy,sz,col});
  if(kind==='castle'){
    for(let c=0;c<3;c++) along(.36,(c%2)*.18,(q,k)=>{ const r=mulberry(it.seed+c*7919+k*104729); P('box','b'+c+':'+k,q,.15+c*.3,.37,.3,.36,CASTLE[(r()*CASTLE.length)|0]); });
    along(.36,0,(q,k)=>{ if(k%2===0){ const r=mulberry(it.seed+k*31); P('box','m'+k,q,1.0,.2,.22,.38,CASTLE[(r()*CASTLE.length)|0]); } });
    if(tot>.6) [0,tot].forEach((s,i)=>{ const q=pointAt(info,s);
      P('cyl','t'+i,q,.75,.36,1.5,.36,'#aaa49a'); P('cyl','tc'+i,q,1.55,.42,.12,.42,'#9b958b'); P('cone','tr'+i,q,1.86,.46,.5,.46,'#8f4a3c'); });
  } else if(kind==='fence'){
    const posts=[]; along(.55,0,(q,k)=>{ posts.push(q); P('box','p'+k,q,.25,.08,.5,.08,'#7d5538'); });
    for(let i=1;i<posts.length;i++){ const a=posts[i-1], b=posts[i], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], len=Math.hypot(b[0]-a[0],b[1]-a[1]), yaw=Math.atan2(-(b[1]-a[1]),b[0]-a[0]);
      for(const [j,y] of [[0,.19],[1,.38]]) P('box','r'+j+':'+i,m,y,len+.04,.05,.035,'#a37350',yaw); }
  } else if(kind==='picket'){
    along(.13,0,(q,k)=>{ P('box','k'+k,q,.18,.035,.36,.05,'#f4f1ea'); P('cone','kt'+k,q,.39,.04,.07,.04,'#f4f1ea'); });
    const pts=[]; along(.5,0,q=>pts.push(q));
    for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], len=Math.hypot(b[0]-a[0],b[1]-a[1]), yaw=Math.atan2(-(b[1]-a[1]),b[0]-a[0]);
      for(const [j,y] of [[0,.1],[1,.27]]) P('box','r'+j+':'+i,m,y,len+.02,.035,.03,'#e6e1d6',yaw); }
  } else if(kind==='hedge'){
    along(.2,0,(q,k)=>{ const r=mulberry(it.seed+k*977); const s=.24+r()*.07;
      P('ico','h'+k,[q[0]+(r()-.5)*.06,q[1]+(r()-.5)*.06],.24+r()*.04,s,s*(1.15+r()*.25),s,HEDGE[(r()*HEDGE.length)|0],r()*6.283); });
  }

}
const WALL_GEO={stone:G.stone, box:G.box, cyl:G.cyl, cone:G.cone, ico:G.ico1};
function writeWall(mesh,now){
  const st=mesh.userData.stones; let anim=false;
  for(let i=0;i<st.length;i++){ const s=st[i]; let p=1; if(s.born && !reduceMotion){ p=clamp((now-s.born)/380,0,1); if(p<1) anim=true; }
    const e=p<1?Math.max(.001,easeOutBack(p)):1;
    dummy.position.set(s.x, s.y+(1-p)*.3, s.z); dummy.rotation.set(0,s.yaw,0); dummy.scale.set(s.sx*e,s.sy*e,s.sz*e); dummy.updateMatrix(); mesh.setMatrixAt(i,dummy.matrix); }
  mesh.instanceMatrix.needsUpdate=true; mesh.userData.animating=anim;
}
function buildWall(it,animate){
  const pieces=wallPieces(it), births=it._b||(it._b=new Map()), now=performance.now();
  let fresh=0;
  for(const s of pieces){ if(animate){ if(!births.has(s.key)){ births.set(s.key,now); fresh++; } s.born=births.get(s.key); } else s.born=0; }
  const grp=new THREE.Group(), byGeo={};
  for(const s of pieces) (byGeo[s.geo]||(byGeo[s.geo]=[])).push(s);
  grp.userData={isWall:true, meshes:[], fresh, animating:false};
  for(const k in byGeo){ const list=byGeo[k];
    const mesh=new THREE.InstancedMesh(WALL_GEO[k],instMat,list.length);
    list.forEach((s,i)=>mesh.setColorAt(i,tmpColor.set(s.col)));
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
    mesh.castShadow=mesh.receiveShadow=true; mesh.frustumCulled=false; mesh.userData.stones=list;
    writeWall(mesh,now); grp.add(mesh); grp.userData.meshes.push(mesh);
    if(mesh.userData.animating) grp.userData.animating=true; }
  return grp;
}

/* flowers: one shared instanced field */
const MAXF=3000;
function mkInst(geo,cap){ const m=new THREE.InstancedMesh(geo,instMat,cap); m.setColorAt(0,tmpColor.set('#ffffff')); m.count=0; m.castShadow=true; m.receiveShadow=true; m.frustumCulled=false; scene.add(m); return m; }
const tufts=mkInst(G.ico0,MAXF), stems=mkInst(G.box,MAXF*6), heads=mkInst(G.ico0,MAXF*6);
stems.castShadow=false;
function flowerLayout(it){ const r=mulberry(it.seed), hs=[], n=3+((r()*3)|0), base=PETALS[it.c];
  for(let i=0;i<n;i++){ const a=r()*6.283, d=.03+r()*.13; hs.push({x:it.x+Math.cos(a)*d, y:.1+r()*.13, z:it.z+Math.sin(a)*d, s:.045+r()*.025, col:r()<.2?'#ffffff':base}); }
  return {hs, t:{s:.13+r()*.07, col:r()<.5?'#74b052':'#86c062'}}; }
function writeFlowers(now){
  let ti=0, hi=0, anim=false;
  for(const it of items){ if(it.t!=='fl') continue; if(ti>=MAXF) break;
    let L=flay.get(it.id); if(!L){ L=flowerLayout(it); flay.set(it.id,L); }
    let p=1; if(it._born && !reduceMotion){ p=clamp((now-it._born)/360,0,1); if(p<1) anim=true; }
    const e=p<1?Math.max(.001,easeOutBack(p)):1;
    dummy.rotation.set(0,0,0);
    dummy.position.set(it.x,.015,it.z); dummy.scale.set(L.t.s*e,L.t.s*.5*e,L.t.s*e); dummy.updateMatrix(); tufts.setMatrixAt(ti,dummy.matrix); tufts.setColorAt(ti,tmpColor.set(L.t.col)); ti++;
    for(const h of L.hs){ const y=h.y*e;
      dummy.position.set(h.x,y/2,h.z); dummy.scale.set(.012,Math.max(.001,y),.012); dummy.updateMatrix(); stems.setMatrixAt(hi,dummy.matrix); stems.setColorAt(hi,tmpColor.set('#5f9a45'));
      dummy.position.set(h.x,y,h.z); dummy.scale.setScalar(h.s*e); dummy.updateMatrix(); heads.setMatrixAt(hi,dummy.matrix); heads.setColorAt(hi,tmpColor.set(h.col)); hi++; }
  }
  for(const [m,c] of [[tufts,ti],[stems,hi],[heads,hi]]){ m.count=c; m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true; }
  flowersAnimating=anim;
}

function buildObj(it,animate){
  let o=null;
  if(it.t==='house') o=buildHouse(it); else if(it.t==='tree') o=buildTree(it); else if(it.t==='lamp') o=buildLamp(it); else if(it.t==='wall') o=buildWall(it,animate);
  if(!o) return null;
  scene.add(o); objs.set(it.id,o);
  if(animate && it.t!=='wall' && !reduceMotion){ o.userData.born=performance.now(); popping.add(o); o.scale.setScalar(.001); }
  return o;
}
function disposeObj(o){ if(o.userData.isWall) o.userData.meshes.forEach(m=>m.dispose()); (o.userData.smoke||[]).forEach(p=>p.material.dispose()); }
function dropObj(it){ const o=objs.get(it.id); if(!o) return; scene.remove(o); popping.delete(o); disposeObj(o); objs.delete(it.id); }
function addItem(it,animate=true){ it.id=nextId++; items.push(it); if(it.t==='fl'){ it._born=animate?performance.now():0; flowersDirty=true; } else buildObj(it,animate); changed(); return it; }
function removeItem(it){ const i=items.indexOf(it); if(i>=0) items.splice(i,1); if(it.t==='fl'){ flay.delete(it.id); flowersDirty=true; } else dropObj(it); changed(); }
function rebuildAll(){ for(const [,o] of objs){ scene.remove(o); disposeObj(o); } objs.clear(); popping.clear(); flay.clear();
  nextId=1; for(const it of items){ nextId=Math.max(nextId,(it.id||0)+1); } for(const it of items){ if(!it.id) it.id=nextId++; if(it.t!=='fl') buildObj(it,false); }
  flowersDirty=true; changed(); }

/* ---------- placement rules ---------- */
const houseAt=(gx,gz)=>items.find(i=>i.t==='house'&&i.gx===gx&&i.gz===gz);
function inHouse(x,z,pad=0){ const gx=Math.round(x/GRID), gz=Math.round(z/GRID), h=houseAt(gx,gz); return !!h && Math.abs(x-gx*GRID)<.6+pad && Math.abs(z-gz*GRID)<.6+pad; }
function clearCell(gx,gz){ const cx=gx*GRID, cz=gz*GRID; for(const it of items.slice()){ if((it.t==='tree'||it.t==='lamp'||it.t==='fl') && Math.abs(it.x-cx)<.75 && Math.abs(it.z-cz)<.75) removeItem(it); } }
// Rebuild a cottage and its four neighbours (joins, shared roofs and covered windows depend on them).
function refreshAround(gx,gz,bounce,skipSelf){
  for(const [a,b] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){ if(skipSelf && !a && !b) continue; const h=houseAt(gx+a,gz+b); if(!h) continue;
    dropObj(h); const o=buildObj(h,false);
    if(o && h===bounce && !reduceMotion){ o.userData.born=performance.now(); o.userData.bounce=true; popping.add(o); } }
}
const FACE_DIR=[[0,1],[1,0],[0,-1],[-1,0]]; // world direction the front door faces, per face value
function placeHouse(gx,gz){
  const ex=houseAt(gx,gz);
  if(ex){ if(ex.floors>=4){ toast('Four floors is as tall as cottages get'); sfx.no(); return false; }
    ex.floors++; refreshAround(gx,gz,ex); changed(); sfx.house(ex.floors); puff(gx*GRID,BASE+ex.floors*FH,gz*GRID,6); return true; }
  if(Math.hypot(gx*GRID,gz*GRID)>R-1.05) return false;
  if(isWater(gx*GRID,gz*GRID)){ toast('Cottages need dry ground'); sfx.no(); return false; }
  clearCell(gx,gz);
  const nbs=FACE_DIR.map(([a,b])=>houseAt(gx+a,gz+b));
  const nb=nbs.find(Boolean);
  const rc = nb && Math.random()<.6 ? nb.rc : rint(ROOFS.length);
  // face the door away from neighbours so it isn't hidden by a join
  const free=[0,1,2,3].filter(f=>!nbs[f]); const face=free.length?free[rint(free.length)]:rint(4);
  addItem({t:'house',gx,gz,floors:1,wc:rint(WALLS.length),rc,rot:rint(2),face,seed:newSeed()});
  refreshAround(gx,gz,null,true);
  sfx.house(1); puff(gx*GRID,.1,gz*GRID,10); return true;
}
function rotateHouse(h){ h.face=(h.face+1)%4; refreshAround(h.gx,h.gz,h); changed(); sfx.rotate(); }
function plantTree(x,z){ if(inHouse(x,z,.15) || isWater(x,z)) return false; const pine=Math.random()<.32;
  addItem({t:'tree',x,z,s:.8+Math.random()*.55,k:pine?1:0,c:pine?rint(PINES.length):(Math.random()<.13?4+rint(2):rint(4)),seed:newSeed()}); sfx.tree(); puff(x,.1,z,5); return true; }
function plantFlower(x,z){ if(inHouse(x,z) || Math.hypot(x,z)>R-.25 || isWater(x,z)) return false; addItem({t:'fl',x,z,c:rint(PETALS.length),seed:newSeed()}); sfx.flower(); return true; }
function placeLamp(x,z){ if(inHouse(x,z,.1) || isWater(x,z)) return false; addItem({t:'lamp',x,z}); sfx.lamp(); return true; }
function eraseAround(p){
  let did=false;
  for(const it of items.slice()){
    if((it.t==='tree'||it.t==='lamp'||it.t==='fl') && Math.hypot(it.x-p.x,it.z-p.z)<ERASE_R+(it.t==='tree'?.15:0)){ removeItem(it); did=true; }
    else if(it.t==='wall'){
      const dense=resample(chaikin(it.pts),.15); const keep=dense.map(q=>Math.hypot(q[0]-p.x,q[1]-p.z)>ERASE_R);
      if(keep.every(Boolean)) continue;
      removeItem(it); did=true; let run=[];
      const flush=()=>{ if(run.length>=3) addItem({t:'wall',kind:it.kind,pts:run,seed:it.seed+run.length*31},false); run=[]; };
      dense.forEach((q,i)=>{ if(keep[i]) run.push(q); else flush(); }); flush();
    }
  }
  erasePaint(p.x,p.z,ERASE_R);
  return did;
}

/* ---------- undo / save ---------- */
const undoStack=[];
function copyCanvas(c){ const k=mkCanvas(); k.getContext('2d').drawImage(c,0,0); return k; }
// layers: which paint canvases this step can change (only those are copied, to keep memory down)
function pushUndo(layers){ const snap={items:JSON.stringify(items,rep), paint:{}};
  for(const k of layers||[]) snap.paint[k]=copyCanvas(PAINT[k][0]);
  undoStack.push(snap); if(undoStack.length>30) undoStack.shift(); }
function restore(s){
  items=JSON.parse(s.items);
  for(const k in s.paint){ const ctx=PAINT[k][1]; ctx.clearRect(0,0,S,S); ctx.drawImage(s.paint[k],0,0); groundDirty=true; }
  rebuildAll();
}
function undo(){ if(stroke) return; const s=undoStack.pop(); if(!s){ toast('Nothing left to undo'); return; } restore(s); sfx.undo(); }

const KEY='pocket-glade-v1'; let saveT=0;
function changed(){ statsDirty=true; clearTimeout(saveT); saveT=setTimeout(save,800); }
function serialize(){ return {v:1, items:JSON.parse(JSON.stringify(items,rep)), path:pathC.toDataURL('image/png'), peb:pebC.toDataURL('image/png'),
  dirt:dirtC.toDataURL('image/png'), water:waterC.toDataURL('image/png'), time:timeVal}; }
function save(){ if(stroke){ saveT=setTimeout(save,500); return; } try{ localStorage.setItem(KEY, JSON.stringify(serialize())); }catch(e){} }
function loadState(st){
  items=Array.isArray(st.items)?st.items:[];
  for(const k in PAINT) PAINT[k][1].clearRect(0,0,S,S);
  const draw=(src,ctx)=>{ if(!src) return; const im=new Image(); im.onload=()=>{ ctx.drawImage(im,0,0); groundDirty=true; }; im.src=src; };
  draw(st.path,pCtx); draw(st.peb,bCtx); draw(st.dirt,dCtx); draw(st.water,wCtx);

}

/* ---------- sample village ---------- */
function seedVillage(){
  items=[]; for(const k in PAINT) PAINT[k][1].clearRect(0,0,S,S);
  const paths=[
    [[.62,.3],[1.6,-.5],[3,-1.4],[4.6,-1.5],[6.1,-.6],[8,.4],[10.4,.9]],
    [[.62,.3],[-.3,1.15],[-2,1.25],[-4,1.1],[-5.6,.4],[-7.6,-.4],[-10.4,-.8]],
    [[.62,.3],[1.05,2.1],[1.4,4.2],[1.2,6.2],[.5,8.2],[-.3,10.4]]
  ];
  for(const pl of paths) for(let i=0;i<pl.length-1;i++) strokePath({x:pl[i][0],z:pl[i][1]},{x:pl[i+1][0],z:pl[i+1][1]});
  // a pond with a little stream, and a tilled garden
  for(let a=0;a<6.283;a+=.35) for(const rr of [0,.5,.9]) stampWater(4.3+Math.cos(a)*rr*1.1,-4.6+Math.sin(a)*rr*.8);
  strokeWith(stampWater,{x:5.2,z:-5.2},{x:7.2,z:-6.8},.2);
  for(let x=-4.2;x<=-2.4;x+=.25) for(let z=3.3;z<=4.3;z+=.25) stampDirt(x,z);
  const walls=[[], [[2.4,4.9],[3.4,5.3],[4.6,5],[5.5,4.1],[5.7,3],[5.2,2.1]], [[-1.6,-4.3],[-2.4,-3.3],[-3.6,-2.9],[-4.6,-3.4]],
    [[-4.7,2.95],[-1.95,2.95],[-1.95,4.7],[-4.7,4.7],[-4.7,3.2]]];
  const kinds=['castle','stone','fence','picket'];
  for(let a=200;a<=292;a+=6){ const r=a*Math.PI/180; walls[0].push([Math.cos(r)*7.6,Math.sin(r)*7.6]); }
  const hs=[[-1,-1,2,0],[0,-1,1,0],[-1,0,1,3],[1,1,2,1],[2,1,1,1],[-3,2,1,2],[0,2,1,3],[-2,-2,1,0]];
  hs.forEach(([gx,gz,f,rc])=>addItem({t:'house',gx,gz,floors:f,wc:rint(WALLS.length),rc,rot:rint(2),face:rint(4),seed:newSeed()},false));
  walls.forEach((pts,i)=>addItem({t:'wall',kind:kinds[i],pts,seed:newSeed()},false));
  const pathPts=paths.flatMap(pl=>resample(pl,.4)), wallPts=walls.flatMap(w=>resample(w,.3));
  const near=(x,z,arr,d)=>arr.some(q=>Math.hypot(q[0]-x,q[1]-z)<d);
  let tries=0, trees=0;
  while(trees<22 && tries<600){ tries++; const a=Math.random()*6.283, d=4.2+Math.random()*5.9, x=Math.cos(a)*d, z=Math.sin(a)*d;
    if(near(x,z,pathPts,1.05)||near(x,z,wallPts,.75)||inHouse(x,z,.4)||nearWater(x,z,.6)) continue;
    if(items.some(i=>i.t==='tree'&&Math.hypot(i.x-x,i.z-z)<1.05)) continue;
    const pine=Math.random()<.3; addItem({t:'tree',x,z,s:.8+Math.random()*.55,k:pine?1:0,c:pine?rint(3):(Math.random()<.12?4+rint(2):rint(4)),seed:newSeed()},false); trees++; }
  for(let i=0;i<34;i++){ const a=Math.random()*6.283, d=Math.sqrt(Math.random())*1.2, x=3.9+Math.cos(a)*d, z=3.6+Math.sin(a)*d; if(!near(x,z,wallPts,.3)) addItem({t:'fl',x,z,c:[1,2,0,3][i%4],seed:newSeed()},false); }

    case 'flowers': {
      if(!p) return; if(st.last){ st.acc+=Math.hypot(st.last.x-p.x,st.last.z-p.z); } st.last=p.clone();
      if(!first && st.acc<.26) return; st.acc=0;
      const n=first?3:1; for(let i=0;i<n;i++){ if(plantFlower(p.x+(Math.random()-.5)*.55,p.z+(Math.random()-.5)*.55)) st.changed=true; } return;
    }
    case 'lamp': {
      if(!p) return; if(st.last && Math.hypot(st.last.x-p.x,st.last.z-p.z)<2.2) return;
      if(placeLamp(p.x,p.z)) st.changed=true; st.last=p.clone(); return;
    }
    case 'erase': {
      if(hit.house){ const now=performance.now(); if(first || now-st.lastHouse>420){ st.lastHouse=now; const h=hit.house;
          if(h.floors>1){ h.floors--; refreshAround(h.gx,h.gz); changed(); } else { removeItem(h); refreshAround(h.gx,h.gz); } st.changed=true; sfx.erase(); } return; }
      if(!p) return; if(eraseAround(p)) sfx.erase(); st.changed=true; return;
    }
  }
}

/* ---------- pointer / keyboard ---------- */
const pointers=new Map(); let mode=null, pinch=null, lx=0, ly=0;
function pinchState(){ const v=[...pointers.values()]; const a=v[0], b=v[1]; return {cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, d:Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))}; }
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  ensureAudio(); try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ if(mode==='tool' && stroke){ if(performance.now()-stroke.t0<400) cancelStroke(); else endTool(); } hideCursor(); mode='pinch'; pinch=pinchState(); return; }
  lx=e.clientX; ly=e.clientY;
  if(e.button===2 || (e.button===0 && tool==='look' && !e.shiftKey)){ mode='orbit'; canvas.style.cursor='grabbing'; }
  else if(e.button===1 || (e.button===0 && tool==='look' && e.shiftKey)){ mode='pan'; canvas.style.cursor='grabbing'; e.preventDefault(); }
  else if(e.button===0){ mode='tool'; startTool(e.clientX,e.clientY); }
});
canvas.addEventListener('pointermove',e=>{
  const pt=pointers.get(e.pointerId);
  if(!pt){ if(e.pointerType==='mouse'){ const h=pick(e.clientX,e.clientY); showCursor(h); hoverHouse=h.house||pickHouse(e.clientX,e.clientY); } return; }
  pt.x=e.clientX; pt.y=e.clientY;
  if(mode==='pinch'){ if(pointers.size<2) return; const s=pinchState(); camG.theta-=(s.cx-pinch.cx)*.007; camG.phi=clamp(camG.phi-(s.cy-pinch.cy)*.005,PHI_MIN,PHI_MAX); camG.dist=clamp(camG.dist*pinch.d/s.d,DMIN,DMAX); pinch=s; return; }
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(mode==='orbit'){ camG.theta-=dx*.006; camG.phi=clamp(camG.phi-dy*.004,PHI_MIN,PHI_MAX); }
  else if(mode==='pan') pan(dx,dy);
  else if(mode==='tool'){ const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ce of (evs.length?evs:[e])) moveTool(ce.clientX,ce.clientY); }
});
function up(e){ if(!pointers.has(e.pointerId)) return; pointers.delete(e.pointerId);
  if(mode==='tool') endTool();
  if(pointers.size===0){ mode=null; canvas.style.cursor = tool==='look'?'grab':'crosshair'; if(e.pointerType!=='mouse') hideCursor(); }
  else if(mode==='pinch'){ mode='idle'; } }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('pointerleave',()=>{ if(!pointers.size) hideCursor(); });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); camG.dist=clamp(camG.dist*Math.exp(e.deltaY*.0012),DMIN,DMAX); },{passive:false});
window.addEventListener('keydown',e=>{
  if(e.target && e.target.tagName==='INPUT' && e.target.type==='text') return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const n=parseInt(e.key,10); if(n>=1 && n<=9 && n<=TOOLS.length){ setTool(TOOLS[n-1].id); return; } if(e.key==='0' && TOOLS[9]){ setTool(TOOLS[9].id); return; }
  const k=e.key.toLowerCase();
  if(k==='q') camG.theta+=.45; else if(k==='e') camG.theta-=.45;
  else if(k==='r' && !stroke && hoverHouse && items.includes(hoverHouse)){ pushUndo([]); rotateHouse(hoverHouse); }
});

/* ---------- loop ---------- */
let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now; const t=now/1000;
  updateCamera(dt);
  if(groundDirty && now-lastComposite>45) composite();
  if(clutterDirty && !stroke && now-lastComposite>300) updateClutter();
  waterMat.uniforms.time.value=reduceMotion?0:t;
  updatePuffs(now,dt);
  updateDucks(now,dt,t);
  if(flowersDirty||flowersAnimating){ writeFlowers(now); flowersDirty=false; }
  if(statsDirty) updateStats();
  for(const o of popping){ const p=clamp((now-o.userData.born)/460,0,1), base=o.userData.base||1;
    if(o.userData.bounce){ const k=Math.sin(p*Math.PI*2)*(1-p); o.scale.set(base*(1-.07*k),base*(1+.14*k),base*(1-.07*k)); }
    else o.scale.setScalar(base*Math.max(.001,easeOutBack(p)));
    if(p>=1){ o.scale.setScalar(base); o.userData.bounce=false; popping.delete(o); } }
  for(const [,o] of objs){
    if(o.userData.isWall){ if(o.userData.animating){ let a=false; for(const m of o.userData.meshes){ writeWall(m,now); a=a||m.userData.animating; } o.userData.animating=a; } continue; }
    if(o.userData.crown && !reduceMotion){ o.userData.crown.rotation.z=Math.sin(t*1.25+o.userData.ph)*.035; o.userData.crown.rotation.x=Math.cos(t*.9+o.userData.ph)*.02; }
    const sm=o.userData.smoke; if(sm && sm.length){ for(const p of sm){ const u=p.userData, ph=reduceMotion?u.o:(t*.32+u.o)%1;
      p.position.set(u.x+ph*.25, u.y+ph*1.0, u.z+Math.sin(ph*6+u.o*9)*.05); p.scale.setScalar(.05+ph*.14); p.material.opacity=Math.sin(ph*Math.PI)*.6; } }
  }
  for(const c of clouds){ const u=c.userData; if(!reduceMotion) u.a+=u.sp*dt; c.position.set(Math.cos(u.a)*u.r, u.y+Math.sin(t*.3+u.r)*.2, Math.sin(u.a)*u.r); }
  if(fireflies.material.opacity>0){ const pos=fireflies.geometry.attributes.position, b=fireflies.userData.base;
    for(let i=0;i<b.length;i++){ const q=b[i]; pos.setXYZ(i, q[0]+Math.sin(t*.4+q[3])*.6, q[1]+Math.sin(t*.9+q[3]*2)*.25, q[2]+Math.cos(t*.35+q[3])*.6); } pos.needsUpdate=true; }
  const showB = night<.4;
  for(const b of butterflies){ b.visible=showB; if(!showB) continue; const u=b.userData;
    const dx=u.tx-b.position.x, dz=u.tz-b.position.z, d=Math.hypot(dx,dz);
    if(d<.3){ const fl=items.filter(i=>i.t==='fl'); if(fl.length && Math.random()<.7){ const f=fl[rint(fl.length)]; u.tx=f.x; u.tz=f.z; } else { const a=Math.random()*6.283, r=Math.random()*(R-2); u.tx=Math.cos(a)*r; u.tz=Math.sin(a)*r; } }
    else { const sp=Math.min(d,.9*dt); b.position.x+=dx/d*sp; b.position.z+=dz/d*sp; b.rotation.y=Math.atan2(dx,dz); }
    b.position.y=.55+Math.sin(t*2.3+u.ph)*.18; const f=Math.sin(t*22+u.ph)*.9; u.l.rotation.z=f; u.r.rotation.z=-f; }
  renderer.render(scene,camera);
}

/* ---------- boot ---------- */
function start(data){
  resize(); setTool('cottage');
  let st=data && data.state;
  if(!st){ try{ const raw=localStorage.getItem(KEY); if(raw) st=JSON.parse(raw); }catch(e){} }
  if(st && Array.isArray(st.items)){ loadState(st); } else { setTime(.4); seedVillage(); }
  if(!st || typeof st.time!=='number') setTime(.4);
  if(window.claude && window.claude.hot && window.claude.hot.snapshot){ try{ window.claude.hot.snapshot(()=>({state:serialize()})); }catch(e){} }
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
