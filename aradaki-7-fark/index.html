<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: compact game header + stat strip, two illustrated panels side by side (stacked on phones), result card over the board */
:root{
  --bg:#edf1f8; --surface:#ffffff; --ink:#15213a; --muted:#5d6883; --line:#d5dcec; --chip:#e2e8f5;
  --accent:#e2402f; --cobalt:#2346a8; --good:#1b9a67;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#172038; --ink:#e7ecf7; --muted:#97a2bd; --line:#28345a; --chip:#1f2a48;
  --accent:#ff6553; --cobalt:#8aa4ff; --good:#3fd096; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172038; --ink:#e7ecf7; --muted:#97a2bd; --line:#28345a; --chip:#1f2a48;
  --accent:#ff6553; --cobalt:#8aa4ff; --good:#3fd096; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}

.scenes{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px/1 var(--body);color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:9px 14px;cursor:pointer}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat{display:flex;align-items:baseline;gap:8px}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:background .2s,border-color .2s,transform .2s}
.pip.on{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.penalty{font-size:13px;font-weight:700;color:var(--accent);opacity:0;transition:opacity .2s}
.penalty.show{opacity:1}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 14px/1 var(--body);border-radius:10px;padding:10px 14px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}

.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{position:relative;margin:0;min-width:0;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 10px 24px -14px rgba(10,20,50,.45)}
.panel svg{display:block;width:100%;height:auto;aspect-ratio:400/280;max-width:100%;cursor:crosshair;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tag{position:absolute;top:8px;left:8px;font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(10,16,34,.55);padding:5px 7px;border-radius:6px;pointer-events:none}
.panel.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.mk-o{fill:none;stroke:#fff;stroke-width:7;opacity:.9}
.mk{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.miss path{stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.miss .halo{stroke:#fff;stroke-width:7}
.miss{animation:fade .8s ease-out forwards}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.hint{fill:none;stroke:#ffd23f;stroke-width:3;stroke-dasharray:6 5;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

.result{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(2px);border-radius:14px;padding:16px;z-index:2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 50px -20px rgba(10,20,50,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 4px;line-height:1.05}
.card .time{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;margin:10px 0 6px}
.card p{margin:0;color:var(--muted)}
.card .best{margin-top:8px;font-weight:700;color:var(--good)}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;color:var(--muted);font-size:13px}
kbd{font:600 12px var(--body);background:var(--chip);border-radius:5px;padding:2px 6px}

@media (max-width:720px){
  .board{grid-template-columns:1fr;gap:10px}
  .actions{margin-left:0;width:100%}
  .actions .btn{flex:1}
  .stat .v{font-size:20px}
  .pip{width:14px;height:14px}
}
@media (prefers-reduced-motion:reduce){
  .mk{animation:none;stroke-dashoffset:0}
  .panel.shake,.card,.hint{animation:none}
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="2" y="6" width="22" height="30" rx="5" fill="var(--cobalt)"/>
        <rect x="20" y="8" width="22" height="30" rx="5" fill="var(--accent)" opacity=".92"/>
        <circle cx="31" cy="23" r="7" fill="none" stroke="#fff" stroke-width="3"/>
      </svg>
      <div>
        <h1>Aradaki <em>7</em> Fark</h1>
        <p class="sub">İki resim arasındaki 7 farkı bul. Resimlerden birine dokun.</p>
      </div>
    </div>
    <nav class="scenes" id="scenes" aria-label="Sahne seç"></nav>
  </header>

  <section class="bar" aria-live="polite">
    <div class="stat"><span class="k">Bulunan</span><div class="pips" id="pips"></div></div>
    <div class="stat"><span class="k">Süre</span><span class="v" id="time">00:00</span><span class="penalty" id="pen">+5 sn</span></div>
    <div class="stat"><span class="k">Hata</span><span class="v" id="miss">0</span></div>
    <div class="actions">
      <button class="btn" id="hintBtn" type="button">İpucu (3)</button>
      <button class="btn primary" id="newBtn" type="button">Yeni farklar</button>
    </div>
  </section>

  <section class="board" id="board">
    <figure class="panel" id="p0"><svg viewBox="0 0 400 280" role="img" aria-label="Sol resim"></svg><span class="tag">Resim 1</span></figure>
    <figure class="panel" id="p1"><svg viewBox="0 0 400 280" role="img" aria-label="Sağ resim"></svg><span class="tag">Resim 2</span></figure>
    <div class="result" id="result" hidden>
      <div class="card">
        <h2>Hepsini buldun!</h2>
        <div class="time" id="rTime">00:00</div>
        <p id="rInfo"></p>
        <p class="best" id="rBest"></p>
        <div class="row">
          <button class="btn" id="againBtn" type="button">Aynı sahne, yeni farklar</button>
          <button class="btn primary" id="nextBtn" type="button">Sonraki sahne</button>
        </div>
      </div>
    </div>
  </section>

  <div class="foot">
    <span>Yanlış tıklama +5 sn, ipucu +10 sn ekler. Her oyunda farklar rastgele seçilir.</span>
    <span><kbd>İ</kbd> ipucu · <kbd>Y</kbd> yeni farklar</span>
  </div>
</div>

/* ---------- rng + round building ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function baseState(it){return {dx:0,dy:0,s:1,f:1,hidden:!!it.add,p:it.p};}
function mutState(it,m,r){
  const st={dx:0,dy:0,s:1,f:1,hidden:!!it.add,p:{...it.p}};
  switch(m[0]){
    case 'prop':st.p[m[1]]=m[2][Math.floor(r()*m[2].length)];break;
    case 'hide':st.hidden=true;break;
    case 'flip':st.f=-1;break;
    case 'move':st.dx=m[1];st.dy=m[2];break;
    case 'size':st.s=m[1];break;
    case 'add':st.hidden=false;break;
  }
  return st;
}
function drawItem(it,st){
  if(st.hidden)return '';
  const k=(it.k||1)*st.s;
  return `<g transform="translate(${it.x+st.dx} ${it.y+st.dy}) scale(${st.f*k} ${k})">${it.draw(st.p)}</g>`;
}
function buildDiffs(si,seed){
  const sc=SCENES[si],r=rng(seed);
  const idx=sc.items.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  const out=[];
  for(const i of idx){
    if(out.length===DIFFS)break;
    const it=sc.items[i],m=it.muts[Math.floor(r()*it.muts.length)],st=mutState(it,m,r);
    const h={x:it.x+st.dx/2,y:it.y+st.dy/2,r:it.r*Math.max(st.s,1)+Math.hypot(st.dx,st.dy)/2};
    if(out.some(d=>Math.hypot(d.x-h.x,d.y-h.y)<d.r+h.r-4))continue;
    out.push({i,st,side:r()<.5?0:1,...h});
  }
  return out;
}
function renderSide(si,diffs,side){
  const sc=SCENES[si];let s=sc.bg;
  sc.items.forEach((it,i)=>{const d=diffs.find(d=>d.i===i);s+=drawItem(it,(d&&d.side===side)?d.st:baseState(it));});
  return s+'<g class="marks"></g><g class="fx"></g>';
}

/* ---------- state + UI ---------- */
const $=id=>document.getElementById(id);
const panels=[$('p0'),$('p1')],svgs=panels.map(p=>p.querySelector('svg'));
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
let S=null,tick=null,penTimer=null;

function loadBest(){try{return JSON.parse(localStorage.getItem('yedifark-best')||'{}')||{};}catch(e){return {};}}
function saveBest(b){try{localStorage.setItem('yedifark-best',JSON.stringify(b));}catch(e){}}

function now(){return performance.now();}
function totalSec(){const run=S.done?S.runMs:(now()-S.t0);return run/1000+S.penalty;}

function start(data){
  data=data||{};
  if(data.S&&SCENES[data.S.scene]){
    const d=data.S;
    newGame(d.scene,d.seed,false);
    S.found=d.found;S.misses=d.misses;S.hints=d.hints;S.penalty=d.penalty;S.t0=now()-d.runMs;S.done=d.done;S.runMs=d.runMs;
    S.found.forEach((f,k)=>{if(f)addMark(k,false);});
    updateBar();
    if(S.done)showResult(false);
  }else newGame(0,Math.floor(Math.random()*1e9),true);
  window.claude?.hot?.snapshot?.(()=>({S:S&&{scene:S.scene,seed:S.seed,found:S.found,misses:S.misses,hints:S.hints,penalty:S.penalty,done:S.done,runMs:S.done?S.runMs:now()-S.t0}}));
}

function newGame(si,seed){
  const diffs=buildDiffs(si,seed);
  S={scene:si,seed,diffs,found:diffs.map(()=>false),misses:0,hints:HINTS,penalty:0,t0:now(),done:false,runMs:0};
  svgs.forEach((svg,side)=>svg.innerHTML=renderSide(si,diffs,side));
  $('result').hidden=true;
  renderChips();updateBar();
  clearInterval(tick);tick=setInterval(()=>{if(!S.done)$('time').textContent=fmt(totalSec());},250);
}

function renderChips(){
  const nav=$('scenes');nav.innerHTML='';
  SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=sc.name;b.setAttribute('aria-pressed',String(i===S.scene));b.onclick=()=>newGame(i,Math.floor(Math.random()*1e9));nav.appendChild(b);});
}
function updateBar(){
  const pips=$('pips');
  if(pips.children.length!==DIFFS){pips.innerHTML='';for(let i=0;i<DIFFS;i++){const s=document.createElement('span');s.className='pip';pips.appendChild(s);}}
  const n=S.found.filter(Boolean).length;
  [...pips.children].forEach((p,i)=>p.classList.toggle('on',i<n));
  pips.setAttribute('aria-label',`${n} / ${DIFFS} fark bulundu`);
  $('miss').textContent=S.misses;
  $('time').textContent=fmt(totalSec());
  const hb=$('hintBtn');hb.textContent=`İpucu (${S.hints})`;hb.disabled=S.hints<=0||S.done;
}
function flashPenalty(sec){const el=$('pen');el.textContent=`+${sec} sn`;el.classList.add('show');clearTimeout(penTimer);penTimer=setTimeout(()=>el.classList.remove('show'),900);}

function addMark(k){
  const d=S.diffs[k],r=Math.min(Math.max(d.r+2,13),38);
  svgs.forEach(svg=>{
    svg.querySelector('.marks').insertAdjacentHTML('beforeend',`<circle class="mk-o" cx="${d.x}" cy="${d.y}" r="${r}"/><circle class="mk" cx="${d.x}" cy="${d.y}" r="${r}" pathLength="1"/>`);
    svg.querySelectorAll(`.hint[data-k="${k}"]`).forEach(h=>h.remove());
  });
}

function pick(e,side){
  if(S.done)return;
  const svg=svgs[side],rc=svg.getBoundingClientRect();
  const x=(e.clientX-rc.left)/rc.width*W,y=(e.clientY-rc.top)/rc.height*H;
  let best=-1,bd=1e9;
  S.diffs.forEach((d,k)=>{if(S.found[k])return;const dist=Math.hypot(d.x-x,d.y-y);if(dist<=d.r+6&&dist<bd){bd=dist;best=k;}});
  if(best>=0){
    S.found[best]=true;addMark(best);updateBar();
    if(S.found.every(Boolean))win();
    return;
  }
  if(S.diffs.some((d,k)=>S.found[k]&&Math.hypot(d.x-x,d.y-y)<=d.r+6))return;
  S.misses++;S.penalty+=MISS_PEN;flashPenalty(MISS_PEN);updateBar();
  const fx=svg.querySelector('.fx');
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','miss');g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  g.innerHTML='<path class="halo" d="M-7 -7 L7 7 M7 -7 L-7 7"/><path d="M-7 -7 L7 7 M7 -7 L-7 7"/>';
  fx.appendChild(g);setTimeout(()=>g.remove(),820);
  const p=panels[side];p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');
}

function hint(){
  if(S.done||S.hints<=0)return;
  const left=S.diffs.map((d,k)=>k).filter(k=>!S.found[k]);
  if(!left.length)return;
  const k=left[Math.floor(Math.random()*left.length)],d=S.diffs[k],r=Math.min(Math.max(d.r+10,24),48);
  S.hints--;S.penalty+=HINT_PEN;flashPenalty(HINT_PEN);updateBar();
  svgs.forEach(svg=>{
    const fx=svg.querySelector('.fx');
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','hint');c.dataset.k=k;c.setAttribute('cx',d.x);c.setAttribute('cy',d.y);c.setAttribute('r',r);
    fx.appendChild(c);setTimeout(()=>c.remove(),2200);
  });
}

function win(){
  S.runMs=now()-S.t0;S.done=true;clearInterval(tick);updateBar();
  showResult(true);
}
function showResult(record){
  const t=totalSec(),sc=SCENES[S.scene],best=loadBest(),prev=best[sc.id];
  if(record&&(prev==null||t<prev)){best[sc.id]=t;saveBest(best);}
  $('rTime').textContent=fmt(t);
  const used=HINTS-S.hints;
  $('rInfo').textContent=`${sc.name} · ${S.misses} hata · ${used} ipucu`;
  const cur=loadBest()[sc.id];
  $('rBest').textContent=(record&&prev==null)?'İlk rekorun kaydedildi.':(record&&t<prev)?`Yeni rekor! Önceki: ${fmt(prev)}`:(cur!=null?`En iyi süren: ${fmt(cur)}`:'');
  $('result').hidden=false;
  $('nextBtn').focus({preventScroll:true});
}

svgs.forEach((svg,side)=>svg.addEventListener('click',e=>pick(e,side)));
$('hintBtn').onclick=hint;
$('newBtn').onclick=()=>newGame(S.scene,Math.floor(Math.random()*1e9));
$('againBtn').onclick=()=>newGame(S.scene,Math.floor(Math.random()*1e9));
$('nextBtn').onclick=()=>newGame((S.scene+1)%SCENES.length,Math.floor(Math.random()*1e9));
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLocaleLowerCase('tr');
  if(k==='i'||k==='ı'||k==='h'){hint();}
  else if(k==='y'||k==='n'){newGame(S.scene,Math.floor(Math.random()*1e9));}
});

window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
